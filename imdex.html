<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Escape School</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:'Segoe UI',system-ui,sans-serif;color:#e8eef7;user-select:none;
    touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%)}
  #minimap{position:fixed;top:12px;left:12px;border-radius:12px;
    background:rgba(8,12,20,.75);border:1px solid rgba(120,170,255,.25);
    box-shadow:0 8px 30px rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:20;
    width:220px;height:96px;transition:width .3s,height .3s}
  #floorLabel{position:fixed;top:116px;left:12px;z-index:20;font-size:11px;
    letter-spacing:1.5px;color:#8fb6ff;background:rgba(8,12,20,.75);
    padding:4px 10px;border-radius:8px;border:1px solid rgba(120,170,255,.25);transition:.3s}
  #objective{position:fixed;top:12px;right:12px;max-width:240px;z-index:20;
    background:rgba(8,12,20,.78);border:1px solid rgba(120,170,255,.25);
    border-left:3px solid #4d8dff;border-radius:10px;padding:10px 14px;
    font-size:13px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.6);transition:.3s}
  #objective .t{font-size:10px;letter-spacing:2px;color:#6f9dff;margin-bottom:3px}
  #dialogue{position:fixed;left:50%;bottom:180px;transform:translateX(-50%) translateY(20px);
    width:min(760px,92vw);z-index:25;opacity:0;transition:.3s;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,16,26,.94),rgba(6,10,18,.96));
    border:1px solid rgba(120,170,255,.3);border-radius:14px;padding:14px 18px;
    box-shadow:0 14px 50px rgba(0,0,0,.7)}
  #dialogue.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #speaker{font-size:11px;letter-spacing:2px;color:#6f9dff;margin-bottom:5px}
  #dtext{font-size:15px;line-height:1.5}
  #prompt{position:fixed;left:50%;top:52%;transform:translateX(-50%);z-index:22;
    background:rgba(8,12,20,.85);border:1px solid rgba(120,170,255,.4);
    border-radius:10px;padding:8px 16px;font-size:14px;opacity:0;transition:.15s;
    pointer-events:none;white-space:nowrap}
  #prompt.show{opacity:1}
  #prompt b{color:#7fb0ff}
  #controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:21;
    background:rgba(8,12,20,.7);border:1px solid rgba(120,170,255,.2);
    border-radius:10px;padding:8px 16px;font-size:12px;letter-spacing:1px;
    color:#8fb6ff;transition:opacity .5s;text-align:center;white-space:nowrap}
  #controls b{color:#cfe0ff;background:rgba(90,150,255,.18);
    padding:1px 6px;border-radius:4px;margin:0 2px}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity .35s;z-index:40}
  #menu{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:20px;
    background:radial-gradient(ellipse at 50% 30%,#16243d 0%,#070a12 65%,#03050a 100%)}
  #menu h1{font-size:clamp(30px,8vw,96px);letter-spacing:5px;font-weight:800;
    background:linear-gradient(180deg,#dbe9ff,#5d8bff);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(80,140,255,.55));
    text-align:center;line-height:1.1}
  #menu .sub{color:#7f96b8;letter-spacing:4px;font-size:11px;margin-top:-14px}
  .chapter{width:min(430px,88vw);padding:14px 20px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(120,170,255,.3);background:rgba(15,24,40,.7);
    display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .chapter:hover{background:rgba(30,55,100,.8);border-color:#5d8bff;transform:translateY(-2px)}
  .chapter .n{font-size:10px;letter-spacing:2px;color:#6f9dff}
  .chapter .name{font-size:16px;font-weight:600}
  .chapter.locked{cursor:not-allowed;opacity:.4}
  .chapter.locked:hover{transform:none;background:rgba(15,24,40,.7);border-color:rgba(120,170,255,.3)}
  #touchUI{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
  #touchUI.active{display:block}
  #joyZone{position:absolute;left:0;bottom:0;width:45%;height:60%;pointer-events:auto}
  #joyBase{position:absolute;width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(140,180,255,.35);
    background:radial-gradient(circle, rgba(20,35,60,.55), rgba(10,18,32,.35));
    transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;
    box-shadow:0 0 30px rgba(60,120,255,.25) inset}
  #joyBase.on{opacity:1}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9dc2ff, #4d7dff 70%, #2a4ba8);
    border:2px solid rgba(200,225,255,.7);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;
    box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #joyKnob.on{opacity:1}
  #lookZone{position:absolute;right:0;top:0;width:55%;height:100%;
    pointer-events:auto;z-index:1}
  #lookHint{position:absolute;right:16px;top:40%;transform:translateY(-50%);
    font-size:10px;letter-spacing:2px;color:rgba(140,180,255,.4);
    text-align:right;pointer-events:none;transition:opacity .8s;
    writing-mode:vertical-rl;text-orientation:mixed}
  #btnStack{position:absolute;right:16px;bottom:20px;
    display:flex;flex-direction:column;align-items:flex-end;gap:12px;
    pointer-events:auto;z-index:3}
  .tbtn{width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(60,100,180,.85), rgba(20,40,80,.85));
    border:2px solid rgba(140,180,255,.55);
    color:#dbe9ff;font-size:13px;font-weight:700;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5), 0 0 20px rgba(80,140,255,.2) inset;
    transition:transform .08s, background .08s;user-select:none}
  .tbtn:active,.tbtn.pressed{transform:scale(.92);
    background:radial-gradient(circle at 35% 30%, rgba(110,160,255,.95), rgba(40,80,160,.95));}
  .tbtn.small{width:56px;height:56px;font-size:11px}
  #btnSprint.pressed{background:radial-gradient(circle at 35% 30%, rgba(255,220,120,.9), rgba(180,120,30,.9));border-color:#ffd66b}
  .tbtn.disabled{opacity:.28}
  #btnInteract{font-size:20px}
  @media (orientation: portrait){
    #minimap{width:150px;height:66px;top:10px;left:10px}
    #floorLabel{top:82px;left:10px;font-size:10px;padding:3px 8px}
    #objective{max-width:150px;font-size:11px;padding:8px 10px;top:10px;right:10px}
    #objective .t{font-size:9px;letter-spacing:1.5px}
    #dialogue{bottom:150px;padding:12px 14px;border-radius:12px}
    #speaker{font-size:10px}
    #dtext{font-size:13px;line-height:1.4}
    #prompt{font-size:12px;padding:6px 12px;top:46%}
    #btnStack{right:12px;bottom:16px;gap:10px}
    .tbtn{width:62px;height:62px;font-size:12px}
    .tbtn.small{width:50px;height:50px;font-size:10px}
    #btnInteract{font-size:18px}
    #lookHint{font-size:9px;right:10px}
    #joyBase{width:110px;height:110px}
    #joyKnob{width:48px;height:48px}
    #menu h1{letter-spacing:3px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<canvas id="minimap" width="300" height="130"></canvas>
<div id="floorLabel">STOCK 0</div>
<div id="objective"><div class="t">ZIEL</div><div id="otext">—</div></div>
<div id="prompt"></div>
<div id="dialogue"><div id="speaker"></div><div id="dtext"></div></div>
<div id="controls"><b>W A S D</b> laufen · <b>Shift</b> rennen · <b>Maus</b>/<b>←↑↓→</b> umsehen · <b>E</b> interagieren</div>

<div id="touchUI">
  <div id="joyZone"><div id="joyBase"></div><div id="joyKnob"></div></div>
  <div id="lookZone"></div>
  <div id="lookHint">ZIEHEN · UMSEHEN</div>
  <div id="btnStack">
    <div class="tbtn small" id="btnSprint">RENN</div>
    <div class="tbtn" id="btnInteract">E</div>
  </div>
</div>

<div id="fade"></div>

<div id="menu">
  <h1>ESCAPE SCHOOL</h1>
  <div class="sub">EIN 3D-ABENTEUER</div>
  <div class="chapter" id="ch1">
    <div><div class="n">KAPITEL 1</div><div class="name">Der Regentag</div></div>
    <div style="font-size:22px;color:#5d8bff">▶</div>
  </div>
  <div class="chapter locked" id="ch2">
    <div><div class="n">KAPITEL 2</div><div class="name">Coming Soon</div></div>
    <div style="font-size:16px;color:#7f96b8">🔒</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. GRUNDGERÜST
   ============================================================ */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const renderer = new THREE.WebGLRenderer({ antialias:!isTouch, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x1a2130);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(0x1a2130, 22, 95);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.08, 400);
const world = new THREE.Group();
scene.add(world);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x252a33, 0.75));
const amb = new THREE.AmbientLight(0xffffff, 0.30); scene.add(amb);
const dir = new THREE.DirectionalLight(0xadc6e6, 0.55); dir.position.set(-40,50,70); scene.add(dir);
const hemi = scene.children[0];

function updateCameraFov(){
  const aspect = innerWidth / innerHeight;
  if(aspect < 1){
    const hFov = 100 * Math.PI/180;
    const vFov = 2 * Math.atan(Math.tan(hFov/2) / aspect);
    camera.fov = Math.min(95, vFov * 180/Math.PI);
  } else camera.fov = 68;
  camera.updateProjectionMatrix();
}
updateCameraFov();

let audioCtx = null;
function startAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.5;
    const g = audioCtx.createGain(); g.gain.value = 0.06;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start();
  }catch(e){}
}

/* ============================================================
   2. GEBÄUDE-DATEN
   ============================================================ */
const FLOORS = 3;
const FH = 4;
const X0 = -32, X1 = 32;
const Z0 = -12, Z1 = 12;
const CORR = 3.5;
const T = 0.4;
const RX0 = -26, RX1 = 26, NROOMS = 6;
const roomW = (RX1-RX0)/NROOMS;
const roomEdges = [];
for(let i=0;i<=NROOMS;i++) roomEdges.push(RX0 + i*roomW);
const roomCenterX = i => RX0 + (i+0.5)*roomW;

const NAMES_N = ["Klassenzimmer 1","Physik","Chemie","Biologie","Musik","Kunstraum"];
const NAMES_S = ["Mathematik","Deutsch","Englisch","Geschichte","Erdkunde","Bibliothek"];

const colliders = [[],[],[]];
const rooms = [];
const stairZones = [];
const interactables = [];

/* ============================================================
   3. MATERIALIEN
   ============================================================ */
const M = {
  wall:      new THREE.MeshStandardMaterial({ color:0xdde3ea, roughness:0.96 }),
  wallOut:   new THREE.MeshStandardMaterial({ color:0xa8b1bd, roughness:0.96 }),
  slab:      new THREE.MeshStandardMaterial({ color:0x5c636d, roughness:0.95 }),
  corrFloor: new THREE.MeshStandardMaterial({ color:0x6e767f, roughness:0.9 }),
  ceil:      new THREE.MeshStandardMaterial({ color:0xeef2f7, roughness:1 }),
  glass:     new THREE.MeshStandardMaterial({ color:0xa8cdea, transparent:true, opacity:0.16,
                roughness:0.05, metalness:0.2, side:THREE.DoubleSide }),
  door:      new THREE.MeshStandardMaterial({ color:0x8a6a48, roughness:0.75 }),
  doorLock:  new THREE.MeshStandardMaterial({ color:0x5c4630, roughness:0.8 }),
  light:     new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xfff2d0, emissiveIntensity:1.6 }),
  desk:      new THREE.MeshStandardMaterial({ color:0xc9a877, roughness:0.8 }),
  metal:     new THREE.MeshStandardMaterial({ color:0x707a86, roughness:0.5, metalness:0.6 }),
  stair:     new THREE.MeshStandardMaterial({ color:0x9aa3ad, roughness:0.9 }),
  board:     new THREE.MeshStandardMaterial({ color:0x1e3a2a, roughness:0.95 }),
  rail:      new THREE.MeshStandardMaterial({ color:0x3a424e, roughness:0.6, metalness:0.5 }),
};

/* ============================================================
   4. BAUMETHODEN
   ============================================================ */
function addWall(floor, x1, z.1, x2, z2, y0, y1, mat, collide=true){
  const w = Math.max(Math.abs(x2-x1), 0.01);
  const d = Math.max(Math.abs(z2-z1), 0.01);
  const h = y1 - y0;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set((x1+x2)/2, y0 + h/2, (z1+z2)/2);
  world.add(mesh);
  if(collide) colliders[floor].push({
    x1:Math.min(x1,x2), z1:Math.min(z1,z2),
    x2:Math.max(x1,x2), z2:Math.max(z1,z2)
  });
  return mesh;
}
function addLightPanel(x, y, z, w, d){
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), M.light);
  p.position.set(x, y, z); world.add(p);
}
const WINDOW_OFFSET = -1.6;

function buildOuterWallX(floor, zc, winCenters){
  const y0 = floor*FH, y1 = y0 + FH;
  const zA = zc - T/2, zB = zc + T/2;
  winCenters.sort((a,b)=>a-b);
  const xs = [X0-0.2];
  for(const c of winCenters) xs.push(c-1.5, c+1.5);
  xs.push(X1+0.2);
  for(let i=0;i<xs.length;i+=2){
    if(xs[i+1]-xs[i] > 0.01) addWall(floor, xs[i], zA, xs[i+1], zB, y0, y1, M.wallOut);
  }
  for(const c of winCenters){
    addWall(floor, c-1.5, zA, c+1.5, zB, y0, y0+1.1, M.wallOut);
    addWall(floor, c-1.5, zA, c+1.5, zB, y0+2.9, y1, M.wallOut, false);
    const g = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.8), M.glass);
    g.position.set(c, y0+2.0, zc); world.add(g);
    const fr = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.06, 0.06), M.metal);
    fr.position.set(c, y0+112, zc); world.add(fr);
    const fr2 = fr.clone(); fr2.position.y = y0+2.88; world.add(fr2);
    const fr3 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.8, 0.06), M.metal);
    fr3.position.set(c, y0+2.0, zc); world.add(fr3);
  }
}
function buildOuterWallZ(floor, xc, zc1, zc2){
  const y0 = floor*FH, y1 = y0 + FH;
  addWall(floor, xc - T/2, zc1, xc + T/2, zc2, y0, y1, M.wallOut);
}
function buildCorridorWall(floor, zc, doorXs){
  const y0 = floor*FH, y1 = y0 + FH;
  const zA = zc - T/2, zB = zc + T/2;
  doorXs.sort((a,b)=>a-b);
  const xs = [X0];
  for(const d of doorXs) xs.push(d-1.1, d+1.1);
  xs.push(X1);
  for(let i=0;i<xs.length;i+=2){
    if(xs[i+1]-xs[i] > 0.01) addWall(floor, xs[i], zA, xs[i+1], zB, y0, y1, M.wall);
  }
  for(const d of doorXs){
    addWall(floor, d-1.1, zA, d+1.1, zB, y0+2.4, y1, M.wall, false);
    const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.4, T+0.06), M.door);
    f1.position.set(d-1.1, y0+1.2, zc); world.add(f1);
    const f2 = f1.clone(); f2.position.x = d+1.1; world.add(f2);
  }
}

/* ============================================================
   5. SCHULE BAUEN
   ============================================================ */
function buildSchool(){
  for(let f=0; f<FLOORS; f++){
    const y0 = f*FH;

    const slab = new THREE.Mesh(new THREE.BoxGeometry(X1-X0+1, 0.3, Z1-Z0+1), M.slab);
    slab.position.set(0, y0-0.15, 0); world.add(slab);

    const cf = new THREE.Mesh(new THREE.BoxGeometry(X1-X0, 0.04, CORR*2), M.corrFloor);
    cf.position.set(0, y0+0.02, 0); world.add(cf);

    if(f === FLOORS-1){
      const roof = new THREE.Mesh(new THREE.BoxGeometry(X1-X0+1, 0.3, Z1-Z0+1), M.ceil);
      roof.position.set(0, y0+FH+0.15, 0); world.add(roof);
    }

    const northWin = [], southWin = [];
    for(let i=0;i<NROOMS;i++){
      northWin.push(roomCenterX(i) + WINDOW_OFFSET);
      southWin.push(roomCenterX(i) + WINDOW_OFFSET);
    }
    northWin.push(29); northWin.push(-29);
    southWin.push(29); southWin.push(-29);
    buildOuterWallX(f, Z1, northWin);
    buildOuterWallX(f, Z0, southWin);
    buildOuterWallZ(f, X1, Z0, Z1);
    buildOuterWallZ(f, X0, Z0, Z1);

    const doors = [];
    for(let i=0;i<NROOMS;i++) doors.push(roomCenterX(i));
    buildCorridorWall(f,  CORR, doors);
    buildCorridorWall(f, -CORR, doors);

    for(let i=0;i<=NROOMS;i++){
      const x = roomEdges[i];
      addWall(f, x-T/2, CORR, x+T/2, Z1-T/2, y0, y0+FH, M.wall);
      addWall(f, x-T/2, Z0+T/2, x+T/2, -CORR, y0, y0+FH, M.wall);
    }

    for(let i=0;i<NROOMS;i++){
      rooms.push({ floor:f, x1:roomEdges[i], x2:roomEdges[i+1], z1:CORR, z2:Z1-T/2, name:NAMES_N[i] });
      rooms.push({ floor:f, x1:roomEdges[i], x2:roomEdges[i+1], z1:Z0+T/2, z2:-CORR, name:NAMES_S[i] });
    }

    for(let x=-28; x<=28; x+=8) addLightPanel(x, y0+FH-0.12, 0, 2.4, 0.5);
    for(let i=0;i<NROOMS;i++){
      addLightPanel(roomCenterX(i), y0+FH-0.12, 7.5, 2.2, 0.5);
      addLightPanel(roomCenterX(i), y0+FH-0.12, -7.5, 2.2, 0.5);
    }

    // Tafel + Pult in JEDEM Raum (an der Außenwand, gegenüber der Tür)
    for(let i=0;i<NROOMS;i++){
      const cx = roomCenterX(i);
      // Nordraum: Tafel an Z1-Seite
      const bN = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.4, 0.1), M.board);
      bN.position.set(cx + 1.2, y0 + 2.1, Z1 - T/2 - 0.15); world.add(bN);
      const pN = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 0.6), M.desk);
      pN.position.set(cx, y0 + 0.42, Z1 - T/2 - 1.4); world.add(pN);
      // Südraum: Tafel an Z0-Seite
      const bS = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.4, 0.1), M.board);
      bS.position.set(cx + 1.2, y0 + 2.1, Z0 + T/2 + 0.15); world.add(bS);
      const pS = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 0.6), M.desk);
      pS.position.set(cx, y0 + 0.42, Z0 + T/2 + 1.4); world.add(pS);
    }

    // Treppenhaus-Blocker (Treppe selbst ist nicht begehbar, nur Trigger)
    for(const side of [-1, 1]){
      colliders[f].push({
        x1: side<0 ? X0 : 28,
        z1: -CORR,
        x2: side<0 ? -28 : X1,
        z2: CORR
      });
    }
  }

  // Treppen bauen
  for(const side of [-1, 1]){
    for(let f=0; f<FLOORS-1; f++){
      const baseX = side < 0 ? -27.6 : 27.6;
      const topX  = side < 0 ? X0 + 0.6 : X1 - 0.6;
      const numSteps = 14;
      const risePerStep = FH / numSteps;

      for(let s=0; s<numSteps; s++){
        const t0 = s / numSteps;
        const x0 = baseX + (topX - baseX) * t0;
        const x1 = baseX + (topX - baseX) * ((s+1)/numSteps);
        const stepX = (x0+x1)/2;
        const stepW = Math.abs(x1-x0) + 0.02;
        const stepY = f*FH + (s+1)*risePerStep - risePerStep/2;

        const st = new THREE.Mesh(
          new THREE.BoxGeometry(stepW, risePerStep, CORR*2 - 0.5),
          M.stair
        );
        st.position.set(stepX, stepY, 0);
        world.add(st);
      }

      // Handlauf
      for(const zs of [-1, 1]){
        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(Math.abs(topX - baseX) + 0.1, 0.08, 0.08),
          M.rail
        );
        rail.position.set((baseX + topX) / 2, f*FH + FH/2 + 0.85, zs * (CORR - 0.35));
        rail.rotation.z = Math.atan2(FH, Math.abs(topX - baseX)) * (side < 0 ? 1 : -1);
        world.add(rail);
      }
    }

    // Trigger-Zonen an der Basis der Treppe
    for(let f=0; f<FLOORS; f++){
      stairZones.push({
        floor:f, side,
        x1: side<0 ? X0 : 26,
        x2: side<0 ? -26 : X1,
        z1: -CORR, z2: CORR
      });
      const mark = new THREE.Mesh(
        new THREE.PlaneGeometry(5.5, CORR*2-0.4),
        new THREE.MeshStandardMaterial({ color:0x2b6bff, transparent:true, opacity:0.13 })
      );
      mark.rotation.x = -Math.PI/2;
      mark.position.set(side<0 ? -29 : 29, f*FH+0.05, 0);
      world.add(mark);
    }
  }

  // Verschlossene Türen
  const lockedDoors = [
    { floor:2, x:roomCenterX(3), z: CORR, name:'Lehrerzimmer' },
    { floor:1, x:roomCenterX(5), z:-CORR, name:'Bibliothek'  },
  ];
  for(const d of lockedDoors){
    const y0 = d.floor*FH;
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.4, 0.12), M.doorLock);
    door.position.set(d.x, y0+1.2, d.z); world.add(door);
    colliders[d.floor].push({ x1:d.x-1.05, z1:d.z-0.35, x2:d.x+1.05, z2:d.z+0.35 });
    interactables.push({
      floor:d.floor, x:d.x, z:d.z, r:2.4,
      label:`Tür – ${d.name}`,
      action:()=> say('', 'Abgeschlossen. Diese Tür ist verschlossen.', 2.4)
    });
  }
}

function makeCharacter(o={}){
  const g = new THREE.Group();
  const skin  = new THREE.MeshStandardMaterial({ color:o.skin  ?? 0xe8b58a, roughness:0.85 });
  const shirt = new THREE.MeshStandardMaterial({ color:o.shirt ?? 0x2f6fb8, roughness:0.9 });
  const pants = new THREE.MeshStandardMaterial({ color:o.pants ?? 0x2b3342, roughness:0.95 });
  const hair  = new THREE.MeshStandardMaterial({ color:o.hair  ?? 0x3a2a1e, roughness:0.9 });
  const shoe  = new THREE.MeshStandardMaterial({ color:o.shoe  ?? 0xeaeaea, roughness:0.75 });
  const dark  = new THREE.MeshStandardMaterial({ color:0x14181f, roughness:0.5 });

  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.22,0.26), pants);
  hips.position.y = 0.92; g.add(hips);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.60,0.30), shirt);
  torso.position.y = 1.32; g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19,20,16), skin);
  head.position.y = 1.80; head.scale.set(1,1.08,1); g.add(head);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.202,20,16), hair);
  cap.position.y = 1.84; cap.scale.set(1,0.78,1.02); g.add(cap);
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.20,16,12), hair);
  back.position.set(0,1.80,-0.03); back.scale.set(0.98,0.95,0.98); g.add(back);

  for(const sx of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8), dark);
    eye.position.set(sx*0.072, 1.81, 0.172); g.add(eye);
  }

  function limb(px, py, w, h, mat, matEnd, endSize){
    const pivot = new THREE.Group();
    pivot.position.set(px, py, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,w), mat);
    m.position.y = -h/2; pivot.add(m);
    const e = new THREE.Mesh(new THREE.BoxGeometry(endSize,endSize,endSize), matEnd);
    e.position.y = -h - endSize*0.3; pivot.add(e);
    g.add(pivot);
    return pivot;
  }
  const armL = limb(-0.33, 1.56, 0.14, 0.52, shirt, skin, 0.13);
  const armR = limb( 0.33, 1.56, 0.14, 0.52, shirt, skin, 0.13);
  const legL = limb(-0.14, 0.90, 0.17, 0.80, pants, shoe, 0.15);
  const legR = limb( 0.14, 0.90, 0.17, 0.80, pants, shoe, 0.15);
  legL.children[1].scale.set(1,0.7,1.9);
  legR.children[1].scale.set(1,0.7,1.9);

  const bag = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.42,0.18),
    new THREE.MeshStandardMaterial({ color:o.bag ?? 0x1e2530, roughness:0.9 }));
  bag.position.set(0,1.34,-0.22); g.add(bag);

  g.userData = { armL, armR, legL, legR, torso, baseY:0 };
  return g;
}

function applyPose(ch, sitBlend, animT, speed){
  const u = ch.userData;
  const walkAmp = Math.min(speed/4.2, 1) * (1 - sitBlend);
  const s = Math.sin(animT*11) * walkAmp;
  u.legL.rotation.x = -1.55*sitBlend + s*0.85;
  u.legR.rotation.x = -1.55*sitBlend - s*0.85;
  u.armL.rotation.x = -1.15*sitBlend - s*0.70;
  u.armR.rotation.x = -1.15*sitBlend + s*0.70;
  u.torso.position.y = 1.32 + Math.abs(Math.sin(animT*11))*0.035*walkAmp;
  u.torso.rotation.y = -s*0.08;
  ch.position.y = u.baseY - 0.46*sitBlend;
}

function addDesk(x, z, floor){
  const y0 = floor*FH;
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.25,0.07,0.62), M.desk);

    leg.position.set(x+dx, y0+0.38, z+dz); world.add(leg);

/* ============================================================
   9. KOLLISION
   ============================================================ */
function pushOut(px, pz, r, c){
  const cx = Math.max(c.x1, Math.min(px, c.x2));
  const cz = Math.max(c.z1, Math.min(pz, c.z2));
  const dx = px-cx, dz = pz-cz;
  const d2 = dx*dx + dz*dz;
  if(d2 > r*r) return null;
  if(d2 > 1e-8){
    const d = Math.sqrt(d2);
    return [px + dx/d*(r-d), pz + dz/d*(r-d)];
  }
  const left = px-c.x1, right = c.x2-px, top = pz-c.z1, bot = c.z2-pz;
  const m = Math.min(left,right,top,bot);
  if(m===left)  return [c.x1-r, pz];
  if(m===right) return [c.x2+r, pz];
  if(m===top)   return [px, c.z1-r];
  return [px, c.z2+r];
}
function collide(px, pz, floor){
  const r = player.radius;
  for(const c of colliders[floor]){
    const res = pushOut(px, pz, r, c);
    if(res){ px = res[0]; pz = res[1]; }
  }
  return [px, pz];
}

let currentInteract = null;
let elBtnInteractRef = null;

function doInteract(){
  if(menuOpen) return;
  if(currentInteract && currentInteract.action) currentInteract.action();
}
function updateInteract(){
  if(player.state !== 'free'){
    elPrompt.classList.remove('show'); currentInteract = null;
    if(elBtnInteractRef) elBtnInteractRef.classList.add('disabled');
    return;
  }
  let best = null, bestD = 1e9;
  for(const it of interactables){
    if(it.floor !== player.floor) continue;
    const d = Math.hypot(it.x-player.x, it.z-player.z);
    if(d < it.r && d < bestD){ best = it; bestD = d; }
  }
  for(const sz of stairZones){
    if(sz.floor !== player.floor || !stairReady) continue;
    if(player.x > Math.min(sz.x1,sz.x2) && player.x < Math.max(sz.x1,sz.x2)
       && player.z > sz.z1 && player.z < sz.z2){
      const up = player.floor < FLOORS-1;
      const down = player.floor > 0;
      if(up || down){
        const label = up ? 'Treppe hinauf' : 'Treppe hinunter';
        best = { floor:sz.floor, x:player.x, z:player.z, r:99, label,
                 action:()=> useStairs(up ? 1 : -1) };
        bestD = 0;
      }
    }
  }
  currentInteract = best;
  if(best){
    elPrompt.innerHTML = `<b>[E]</b> ${best.label}`;
    elPrompt.classList.add('show');
    if(elBtnInteractRef) elBtnInteractRef.classList.remove('disabled');
  } else {
    elPrompt.classList.remove('show');
    if(elBtnInteractRef) elBtnInteractRef.classList.add('disabled');
  }
}

let stairReady = true;
function useStairs(dir){
  const nf = player.floor + dir;
  if(nf < 0 || nf >= FLOORS) return;
  stairReady = false;
  fadeOut(()=>{
    player.floor = nf;
    player.y = nf*FH;
    // Position aus der Treppenzone heraus verschieben (in den Flur)
    const isRight = player.x > 0;
    player.x = isRight ? 24 : -24;
    player.z = 0;
    elFloor.textContent = 'STOCK ' + nf;
    say('', dir > 0 ? `Du gehst die Treppe hinauf in den ${nf}. Stock.`
                    : `Du gehst die Treppe hinunter in den ${nf}. Stock.`, 2.2);
  });
}

const mm = document.getElementById('minimap');
const mmctx = mm.getContext('2d');
let MMS = 4.0, MMPX = 22, MMPZ = 17;
let wx, wz;
function updateMinimapScale(){
  const r = mm.getBoundingClientRect();
  mm.width  = Math.max(120, Math.round(r.width  * devicePixelRatio));
  mm.height = Math.max(60,  Math.round(r.height * devicePixelRatio));
  const w = mm.width, h = mm.height;
  const spanX = X1 - X0, spanZ = Z1 - Z0;
  MMS = Math.min((w - 20) / spanX, (h - 20) / spanZ);
  MMPX = (w - spanX*MMS) / 2;
  MMPZ = (h - spanZ*MMS) / 2;
  wx = x => (x - X0)*MMS + MMPX;
  wz = z => (Z1 - z)*MMS + MMPZ;
  mmctx.setTransform(1,0,0,1,0,0);
}
wx = x => (x - X0)*MMS + MMPX;
wz = z => (Z1 - z)*MMS + MMPZ;

function drawMinimap(){
  const f = player.floor;
  mmctx.clearRect(0,0,mm.width,mm.height);
  mmctx.fillStyle = 'rgba(8,12,20,0.9)';
  mmctx.beginPath();
  if(mmctx.roundRect) mmctx.roundRect(0,0,mm.width,mm.height,12*devicePixelRatio);
  else mmctx.rect(0,0,mm.width,mm.height);
  mmctx.fill();

  mmctx.fillStyle = 'rgba(40,55,80,0.7)';
  mmctx.fillRect(wx(X0), wz(Z1), (X1-X0)*MMS, (Z1-Z0)*MMS);

  mmctx.fillStyle = 'rgba(140,180,255,0.55)';
  for(const c of colliders[f]){
    mmctx.fillRect(wx(c.x1), wz(c.z2), (c.x2-c.x1)*MMS, (c.z2-c.z1)*MMS);
  }

  const px = wx(player.x), py = wz(player.z);
  const fx = Math.sin(player.rot), fz = Math.cos(player.rot);
  const dp = devicePixelRatio;
  mmctx.save();
  mmctx.translate(px, py);
  mmctx.beginPath();
  mmctx.moveTo(fx*7*dp, -fz*7*dp);
  mmctx.lineTo(-fz*4.5*dp - fx*3*dp,  fx*4.5*dp + fz*3*dp);
  mmctx.lineTo( fz*4.5*dp - fx*3*dp, -fx*4.5*dp + fz*3*dp);
  mmctx.closePath();
  mmctx.fillStyle = '#6fa8ff';
  mmctx.shadowColor = '#4d8dff'; mmctx.shadowBlur = 10*dp;
  mmctx.fill();
  mmctx.restore();
}

        pauseTimer: Math.random()*2,

      });

function updateNPCs(dt){
  for(const n of npcs){
    if(n.pauseTimer > 0){
      n.pauseTimer -= dt;
      applyPose(n.char, 0, n.walkT, 0);
      continue;
    }
    const dx = n.targetX - n.x;
    if(Math.abs(dx) < 0.3){
      n.dir *= -1;
      n.targetX = n.dir > 0 ? X1 - 6 : X0 + 6;
      n.pauseTimer = 1 + Math.random()*2.5;
      continue;
    }
    const sign = Math.sign(dx);
    n.x += sign * n.speed * dt;
    n.walkT += dt;
    n.char.position.x = n.x;
    n.char.rotation.y = sign > 0 ? Math.PI/2 : -Math.PI/2;
    applyPose(n.char, 0, n.walkT, n.speed);
  }
}

function triggerClassmatesLeave(){
  for(const cm of classmates){
    if(cm.state === 'sitting'){
      cm.state = 'standing';
      cm.standT = 0;
    }
  }
}

function updateClassmates(dt){
  for(const cm of classmates){
    if(cm.state === 'sitting') continue;

    if(cm.state === 'standing'){
      cm.standT = (cm.standT || 0) + dt;
      cm.sitBlend = Math.max(0, 1 - cm.standT / 1.2);
      applyPose(cm.char, cm.sitBlend, 0, 0);
      if(cm.standT > 1.2){
        cm.state = 'walking';
        cm.walkT = 0;
      }
    } else if(cm.state === 'walking'){
      // zur Tür laufen: z kleiner werden lassen (Richtung CORR)
      const doorZ = CORR + 0.4;
      const dz = doorZ - cm.z;
      if(Math.abs(dz) < 0.15){
        cm.state = 'gone';
        cm.char.visible = false;
        continue;
      }
      const sign = Math.sign(dz);
      cm.z += sign * 2.6 * dt;
      cm.walkT += dt;
      cm.char.position.z = cm.z;
      cm.char.rotation.y = Math.PI;   // Richtung -z (Tür)
      applyPose(cm.char, 0, cm.walkT, 2.6);
    }
  }
}

function updateStory(dt){
  if(!storyStarted) return;
  introTimer += dt;

  if(introStage === 0 && introTimer > 0.7){
    introStage = 1;
    say('FRAU BERGER', 'So … wer kann mir nochmal erklären, warum der Satz des Pythagoras funktioniert?', 4.2);
    say('FRAU BERGER', 'Jonas? Nein? Dann machen wir es nochmal gemeinsam …', 3.8);
  }
  if(introStage === 1 && introTimer > 10){
    introStage = 2;
    say('', '📢 Durchsage: Wegen des starken Regens ist ab jetzt Regenpause. Alle Schülerinnen und Schüler bleiben im Gebäude.', 6);
    setObjective('Steh auf und verlasse das Klassenzimmer.');
    triggerClassmatesLeave();
  }
  if(introStage === 2 && introTimer > 13.5){
    introStage = 3;
    player.state = 'standing-up';
    player.sitTarget = 0;
    say('', 'Du stehst langsam auf und gehst zur Tür.', 2.6);
  }
}

/* ============================================================
   17. LOOP
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0;

function updatePlayer(dt){
  player.sitBlend += (player.sitTarget - player.sitBlend) * Math.min(1, dt*3.5);

  if(player.state === 'standing-up' && player.sitBlend < 0.05){
    player.sitBlend = 0;
    player.state = 'free';
    setObjective('Verlasse das Klassenzimmer und geh auf den Flur.');
    say('', 'Du kannst dich jetzt frei bewegen.', 3);
  }

  const lookSpeed = 1.8;
  if(keys['ArrowLeft'])  camYaw   += lookSpeed * dt;
  if(keys['ArrowRight']) camYaw   -= lookSpeed * dt;
  if(keys['ArrowUp'])    camPitch -= lookSpeed * 0.6 * dt;
  if(keys['ArrowDown'])  camPitch += lookSpeed * 0.6 * dt;
  camPitch = Math.max(-0.75, Math.min(1.05, camPitch));

  let ix = 0, iz = 0;
  if(player.state === 'free'){
    const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
    const rgtX = -fwdZ,             rgtZ =  fwdX;

    if(keys['KeyW']) { ix += fwdX; iz += fwdZ; }
    if(keys['KeyS']) { ix -= fwdX; iz -= fwdZ; }
    if(keys['KeyD']) { ix += rgtX; iz += rgtZ; }
    if(keys['KeyA']) { ix -= rgtX; iz -= rgtZ; }

    if(Math.abs(input.moveX) > 0.02 || Math.abs(input.moveZ) > 0.02){
      ix += fwdX * (-input.moveZ) + rgtX * input.moveX;
      iz += fwdZ * (-input.moveZ) + rgtZ * input.moveX;
    }
  }

  const len = Math.hypot(ix, iz);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || input.sprint;
  const maxSpeed = sprint ? 6.4 : 3.6;

  if(len > 0.001){
    ix /= len; iz /= len;
    player.speed += (maxSpeed - player.speed) * Math.min(1, dt*10);
  } else {
    player.speed += (0 - player.speed) * Math.min(1, dt*12);
  }

  let nx = player.x + ix * player.speed * dt;
  let nz = player.z + iz * player.speed * dt;
  [nx, nz] = collide(nx, nz, player.floor);
  player.x = nx; player.z = nz;

  if(len > 0.001){
    const target = Math.atan2(ix, iz);
    let d = target - player.rot;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    player.rot += d * Math.min(1, dt*14);
  }

  player.y = player.floor * FH;
  player.char.position.x = player.x;
  player.char.position.z = player.z;
  player.char.rotation.y = player.rot;
  applyPose(player.char, player.sitBlend, animT, player.speed);

  if(!stairReady){
    let inside = false;
    for(const sz of stairZones){
      if(sz.floor !== player.floor) continue;
      if(player.x > Math.min(sz.x1,sz.x2) && player.x < Math.max(sz.x1,sz.x2)
         && player.z > sz.z1 && player.z < sz.z2) inside = true;
    }
    if(!inside) stairReady = true;
  }
}

function updateCamera(dt){
  const tx = player.x, ty = player.y + 1.55, tz = player.z;
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const dx = Math.sin(camYaw)*cp, dy = sp, dz = Math.cos(camYaw)*cp;

  const target = new THREE.Vector3(tx, ty, tz);
  let maxT = CAM_DIST;
  const steps = 12;
  for(let i=1;i<=steps;i++){
    const t = CAM_DIST*i/steps;
    const px = tx + dx*t, pz = tz + dz*t;
    let hit = false;
    for(const c of colliders[player.floor]){
      if(px > c.x1-0.3 && px < c.x2+0.3 && pz > c.z1-0.3 && pz < c.z2+0.3){ hit = true; break; }
    }
    if(hit){ maxT = Math.max(1.1, CAM_DIST*(i-1)/steps - 0.15); break; }
  }

  const cx = tx + dx*maxT, cy = ty + dy*maxT, cz = tz + dz*maxT;
  const clampedY = Math.max(player.y + 0.7, Math.min(player.y + FH - 0.35, cy));
  camera.position.lerp(new THREE.Vector3(cx, clampedY, cz), Math.min(1, dt*16));
  camera.lookAt(target);
}

function updateRoomLabel(){
  let name = 'Flur';
  if(Math.abs(player.z) < CORR) {
    if(player.x > 26 || player.x < -26) name = 'Treppenhaus';
    else name = 'Flur';
  }
  for(const r of rooms){
    if(r.floor !== player.floor) continue;
    if(player.x > r.x1 && player.x < r.x2 && player.z > r.z1 && player.z < r.z2){
      name = r.name;
      break;
    }
  }
  elFloor.textContent = 'STOCK ' + player.floor + ' · ' + name;
}

function loop(){
  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;

  if(!menuOpen){
    updatePlayer(dt);
    updateCamera(dt);
    updateInteract();
    updateRoomLabel();
    updateDialogue(dt);
    updateStory(dt);
    updateClassmates(dt);
    updateNPCs(dt);
  }

  updateRain(dt);
  updateLightning(dt);
  drawMinimap();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);

/* ============================================================
   18. RESIZE
   ============================================================ */
function handleResize(){
  camera.aspect = innerWidth/innerHeight;
  updateCameraFov();
  renderer.setSize(innerWidth, innerHeight);
  setTimeout(()=>{ updateMinimapScale(); }, 60);
}
addEventListener('resize', handleResize);
addEventListener('orientationchange', ()=> setTimeout(handleResize, 150));

/* ============================================================
   19. TOUCH-STEUERUNG
   ============================================================ */
const touchUI = document.getElementById('touchUI');
const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const lookZone = document.getElementById('lookZone');
const lookHint = document.getElementById('lookHint');
const btnInteract = document.getElementById('btnInteract');
const btnSprint = document.getElementById('btnSprint');
elBtnInteractRef = btnInteract;

let joyActive = false, joyId = null;
let joyCenter = { x:0, y:0 };
let JOY_RADIUS = 58;
let lookId = null, lookLast = { x:0, y:0 };

function refreshJoyRadius(){
  const r = joyBase.getBoundingClientRect();
  JOY_RADIUS = (r.width || 120) * 0.42;
}

function bindTouchControls(){
  if(!isTouch) return;
  touchUI.classList.add('active');
  refreshJoyRadius();

  joyZone.addEventListener('touchstart', e=>{
    if(menuOpen) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier; joyActive = true;
    joyCenter.x = t.clientX; joyCenter.y = t.clientY;
    joyBase.style.left = t.clientX + 'px'; joyBase.style.top  = t.clientY + 'px';
    joyKnob.style.left = t.clientX + 'px'; joyKnob.style.top  = t.clientY + 'px';
    joyBase.classList.add('on'); joyKnob.classList.add('on');
    refreshJoyRadius();
  }, {passive:false});

  joyZone.addEventListener('touchmove', e=>{
    if(!joyActive) return;
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier !== joyId) continue;
      let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
      joyKnob.style.left = (joyCenter.x + dx) + 'px';
      joyKnob.style.top  = (joyCenter.y + dy) + 'px';
      input.moveX = dx / JOY_RADIUS;
      input.moveZ = dy / JOY_RADIUS;
    }
  }, {passive:false});

  function endJoy(e){
    for(const t of e.changedTouches){
      if(t.identifier !== joyId) continue;
      joyActive = false; joyId = null;
      input.moveX = 0; input.moveZ = 0;
      joyBase.classList.remove('on'); joyKnob.classList.remove('on');
    }
  }
  joyZone.addEventListener('touchend', endJoy);
  joyZone.addEventListener('touchcancel', endJoy);

  lookZone.addEventListener('touchstart', e=>{
    if(menuOpen) return;
    e.preventDefault();
    if(lookId !== null) return;
    const t = e.changedTouches[0];
    lookId = t.identifier;
    lookLast.x = t.clientX; lookLast.y = t.clientY;
    lookHint.style.opacity = '0';
  }, {passive:false});

  lookZone.addEventListener('touchmove', e=>{
    if(lookId === null) return;
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier !== lookId) continue;
      const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
      lookLast.x = t.clientX; lookLast.y = t.clientY;
      camYaw   -= dx * 0.005;
      camPitch += dy * 0.004;
      camPitch = Math.max(-0.75, Math.min(1.05, camPitch));
    }
  }, {passive:false});

  function endLook(e){
    for(const t of e.changedTouches){
      if(t.identifier !== lookId) continue;
      lookId = null;
    }
  }
  lookZone.addEventListener('touchend', endLook);
  lookZone.addEventListener('touchcancel', endLook);

  btnInteract.addEventListener('touchstart', e=>{
    e.preventDefault(); e.stopPropagation();
    btnInteract.classList.add('pressed'); doInteract();
  }, {passive:false});
  btnInteract.addEventListener('touchend', e=>{
    e.preventDefault(); e.stopPropagation();
    btnInteract.classList.remove('pressed');
  }, {passive:false});

  btnSprint.addEventListener('touchstart', e=>{
    e.preventDefault(); e.stopPropagation();
    input.sprint = true; btnSprint.classList.add('pressed');
  }, {passive:false});
  btnSprint.addEventListener('touchend', e=>{
    e.preventDefault(); e.stopPropagation();
    input.sprint = false; btnSprint.classList.remove('pressed');
  }, {passive:false});
  btnSprint.addEventListener('touchcancel', ()=>{
    input.sprint = false; btnSprint.classList.remove('pressed');
  });

  document.addEventListener('gesturestart', e=> e.preventDefault());
  document.addEventListener('dblclick', e=> e.preventDefault());
  elControls.style.display = 'none';
}

/* ============================================================
   20. INITIALISIERUNG + START-BUTTON
   ============================================================ */
buildSchool();
buildIntroScene();
spawnHallNPCs();
applyPose(player.char, 1, 0, 0);
updateMinimapScale();
bindTouchControls();

function startGame(){
  const menu = document.getElementById('menu');
  if(menu) menu.style.display = 'none';
  menuOpen = false;
  startAudio();
  storyStarted = true;
  introTimer = 0;
  introStage = 0;
  setObjective('Hör dem Unterricht zu.');

  if(!isTouch){
    setTimeout(()=>{ elControls.style.opacity = '0'; }, 8000);
    setTimeout(()=>{
      if(renderer.domElement && !document.pointerLockElement)
        renderer.domElement.requestPointerLock();
    }, 120);
  }
}
