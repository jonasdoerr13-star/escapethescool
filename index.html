<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Escape School</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:'Segoe UI',system-ui,sans-serif;color:#e8eef7;user-select:none;
    touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.85) 100%)}
  #speedfx{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    transition:opacity .25s;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(30,60,120,.35) 75%, rgba(8,15,30,.7) 100%)}
  #speedfx.on{opacity:1}

  #minimap{position:fixed;top:12px;left:12px;border-radius:14px;
    background:rgba(8,12,20,.8);border:1px solid rgba(120,170,255,.3);
    box-shadow:0 8px 30px rgba(0,0,0,.6), 0 0 24px rgba(80,140,255,.15) inset;
    backdrop-filter:blur(8px);z-index:20;width:220px;height:96px;transition:width .3s,height .3s}
  #floorLabel{position:fixed;top:116px;left:12px;z-index:20;font-size:11px;
    letter-spacing:1.5px;color:#8fb6ff;background:rgba(8,12,20,.8);
    padding:4px 10px;border-radius:8px;border:1px solid rgba(120,170,255,.3);
    text-shadow:0 0 8px rgba(90,150,255,.6);transition:.3s}

  #progressWrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:20;width:min(320px,44vw);pointer-events:none;opacity:0;transition:opacity .5s}
  #progressWrap.show{opacity:1}
  #progressBar{height:5px;border-radius:3px;overflow:hidden;
    background:rgba(20,30,50,.7);border:1px solid rgba(120,170,255,.25);
    box-shadow:0 0 20px rgba(80,140,255,.2)}
  #progressFill{height:100%;width:0%;transition:width .6s cubic-bezier(.4,0,.2,1);
    background:linear-gradient(90deg,#2b6bff,#6fa8ff,#a8c8ff);
    box-shadow:0 0 12px rgba(110,168,255,.9)}
  #progressText{margin-top:5px;text-align:center;font-size:10px;letter-spacing:2px;
    color:#8fb6ff;text-shadow:0 0 8px rgba(90,150,255,.6)}

  #objective{position:fixed;top:58px;right:12px;max-width:240px;z-index:20;
    background:rgba(8,12,20,.82);border:1px solid rgba(120,170,255,.3);
    border-left:3px solid #4d8dff;border-radius:10px;padding:10px 14px;
    font-size:13px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.6),
      0 0 20px rgba(80,140,255,.1) inset;transition:.3s}
  #objective .t{font-size:10px;letter-spacing:2px;color:#6f9dff;margin-bottom:3px;
    text-shadow:0 0 8px rgba(90,150,255,.7)}

  #dialogue{position:fixed;left:50%;bottom:180px;transform:translateX(-50%) translateY(20px);
    width:min(760px,92vw);z-index:25;opacity:0;transition:.35s cubic-bezier(.2,.9,.3,1);
    pointer-events:none;
    background:linear-gradient(180deg,rgba(10,16,26,.95),rgba(6,10,18,.97));
    border:1px solid rgba(120,170,255,.35);border-radius:14px;padding:14px 18px;
    box-shadow:0 14px 50px rgba(0,0,0,.75), 0 0 30px rgba(80,140,255,.15) inset,
      0 0 0 1px rgba(255,255,255,.03) inset}
  #dialogue.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #speaker{font-size:11px;letter-spacing:2px;color:#6f9dff;margin-bottom:5px;
    text-shadow:0 0 8px rgba(90,150,255,.7)}
  #dtext{font-size:15px;line-height:1.5}

  #prompt{position:fixed;left:50%;top:52%;transform:translateX(-50%);z-index:22;
    background:rgba(8,12,20,.88);border:1px solid rgba(120,170,255,.5);
    border-radius:10px;padding:8px 16px;font-size:14px;opacity:0;transition:.18s;
    pointer-events:none;white-space:nowrap;
    box-shadow:0 0 24px rgba(80,140,255,.35), 0 0 0 1px rgba(255,255,255,.05) inset;
    animation:promptPulse 1.6s ease-in-out infinite}
  #prompt.show{opacity:1;transform:translateX(-50%) scale(1)}
  @keyframes promptPulse{0%,100%{box-shadow:0 0 24px rgba(80,140,255,.35)}
                        50%{box-shadow:0 0 36px rgba(110,168,255,.6)}}
  #prompt b{color:#a8c8ff}

  #controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:21;
    background:rgba(8,12,20,.72);border:1px solid rgba(120,170,255,.22);
    border-radius:10px;padding:8px 16px;font-size:12px;letter-spacing:1px;
    color:#8fb6ff;transition:opacity .5s;text-align:center;white-space:nowrap;
    backdrop-filter:blur(6px)}
  #controls b{color:#cfe0ff;background:rgba(90,150,255,.22);
    padding:1px 6px;border-radius:4px;margin:0 2px}

  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity .4s;z-index:40}

  #menu{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:24px;padding:20px;
    background:radial-gradient(ellipse at 50% 25%,#1a2d4d 0%,#080c16 55%,#03050a 100%);
    overflow:hidden}
  #menuBG{position:absolute;inset:0;pointer-events:none}
  #menu::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 20% 30%, rgba(80,140,255,.15) 0%, transparent 40%),
               radial-gradient(circle at 80% 70%, rgba(140,80,255,.12) 0%, transparent 45%);
    animation:menuGlow 8s ease-in-out infinite;
    pointer-events:none}
  @keyframes menuGlow{
    0%,100%{opacity:.7;transform:scale(1)}
    50%{opacity:1;transform:scale(1.08)}}

  #menu h1{position:relative;font-size:clamp(34px,9vw,110px);letter-spacing:8px;
    font-weight:900;
    background:linear-gradient(180deg,#ffffff 0%,#dbe9ff 30%,#5d8bff 70%,#2b4b9e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(80,140,255,.7)) drop-shadow(0 6px 20px rgba(0,0,0,.6));
    text-align:center;line-height:1.05;z-index:2;
    animation:titlePulse 3.5s ease-in-out infinite}
  @keyframes titlePulse{
    0%,100%{filter:drop-shadow(0 0 40px rgba(80,140,255,.7)) drop-shadow(0 6px 20px rgba(0,0,0,.6))}
    50%{filter:drop-shadow(0 0 70px rgba(120,180,255,.95)) drop-shadow(0 6px 24px rgba(0,0,0,.7))}}
  #menu h1::after{
    content:'ESCAPE SCHOOL';position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 100%;animation:shine 4s ease-in-out infinite;
    pointer-events:none}
  @keyframes shine{
    0%{background-position:200% 0}
    60%,100%{background-position:-100% 0}}

  #menu .sub{color:#7f96b8;letter-spacing:6px;font-size:11px;margin-top:-14px;z-index:2;
    text-shadow:0 0 12px rgba(80,140,255,.5)}

  .chapter{position:relative;width:min(430px,88vw);padding:16px 22px;border-radius:14px;
    cursor:pointer;overflow:hidden;
    border:1px solid rgba(120,170,255,.35);background:rgba(15,24,40,.72);
    display:flex;justify-content:space-between;align-items:center;
    transition:.3s cubic-bezier(.2,.9,.3,1);z-index:2;backdrop-filter:blur(8px);
    box-shadow:0 10px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03) inset}
  .chapter::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 40%,rgba(140,180,255,.25) 50%,transparent 60%);
    background-size:220% 100%;background-position:220% 0;transition:.6s}
  .chapter:hover::before{background-position:-120% 0}
  .chapter:hover{background:rgba(30,55,100,.9);border-color:#7fb0ff;
    transform:translateY(-3px) scale(1.015);
    box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 30px rgba(80,140,255,.4),
      0 0 0 1px rgba(140,180,255,.2) inset}
  .chapter .n{font-size:10px;letter-spacing:2px;color:#6f9dff}
  .chapter .name{font-size:18px;font-weight:700;color:#eaf1ff}
  .chapter .arrow{font-size:22px;color:#5d8bff;
    filter:drop-shadow(0 0 10px rgba(90,150,255,.9));
    transition:transform .3s}
  .chapter:hover .arrow{transform:translateX(6px) scale(1.15)}
  .chapter.locked{cursor:not-allowed;opacity:.45}
  .chapter.locked:hover{transform:none;background:rgba(15,24,40,.72);
    border-color:rgba(120,170,255,.35);box-shadow:0 10px 32px rgba(0,0,0,.5)}
  .chapter.locked:hover::before{background-position:220% 0}

  #menuFooter{margin-top:8px;font-size:11px;letter-spacing:3px;color:#4d6b95;z-index:2;
    text-shadow:0 0 10px rgba(80,140,255,.4)}

  #touchUI{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
  #touchUI.active{display:block}
  #joyZone{position:absolute;left:0;bottom:0;width:45%;height:60%;pointer-events:auto}
  #joyBase{position:absolute;width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(140,180,255,.4);
    background:radial-gradient(circle, rgba(20,35,60,.6), rgba(10,18,32,.35));
    transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;
    box-shadow:0 0 40px rgba(60,120,255,.3) inset, 0 0 20px rgba(60,120,255,.2)}
  #joyBase.on{opacity:1}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bdd4ff, #4d7dff 70%, #2a4ba8);
    border:2px solid rgba(200,225,255,.8);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;
    box-shadow:0 6px 20px rgba(0,0,0,.6), 0 0 20px rgba(120,170,255,.6)}
  #joyKnob.on{opacity:1}
  #lookZone{position:absolute;right:0;top:0;width:55%;height:100%;
    pointer-events:auto;z-index:1}
  #lookHint{position:absolute;right:16px;top:40%;transform:translateY(-50%);
    font-size:10px;letter-spacing:2px;color:rgba(140,180,255,.45);
    text-align:right;pointer-events:none;transition:opacity .8s;
    writing-mode:vertical-rl;text-orientation:mixed}
  #btnStack{position:absolute;right:16px;bottom:20px;
    display:flex;flex-direction:column;align-items:flex-end;gap:12px;
    pointer-events:auto;z-index:3}
  .tbtn{width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(70,115,200,.9), rgba(20,40,80,.9));
    border:2px solid rgba(140,180,255,.6);
    color:#dbe9ff;font-size:13px;font-weight:800;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.55), 0 0 24px rgba(80,140,255,.25) inset;
    transition:transform .08s, background .08s, box-shadow .2s;
    text-shadow:0 0 8px rgba(120,170,255,.7)}
  .tbtn:active,.tbtn.pressed{transform:scale(.9);
    background:radial-gradient(circle at 35% 30%, rgba(130,175,255,.98), rgba(50,95,180,.98));
    box-shadow:0 6px 20px rgba(0,0,0,.55), 0 0 40px rgba(120,170,255,.7) inset}
  .tbtn.small{width:56px;height:56px;font-size:11px}
  #btnSprint.pressed{background:radial-gradient(circle at 35% 30%, rgba(255,225,130,.95), rgba(180,120,30,.95));border-color:#ffe089;
    box-shadow:0 6px 20px rgba(0,0,0,.55), 0 0 40px rgba(255,210,100,.7) inset}
  .tbtn.disabled{opacity:.3}
  .tbtn.glow{animation:btnGlow 1.4s ease-in-out infinite}
  @keyframes btnGlow{
    0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.55), 0 0 24px rgba(80,140,255,.25) inset}
    50%{box-shadow:0 6px 20px rgba(0,0,0,.55), 0 0 50px rgba(120,170,255,.85) inset,
        0 0 20px rgba(120,170,255,.6)}}
  #btnInteract{font-size:20px}

  @media (orientation: portrait){
    #minimap{width:150px;height:66px;top:10px;left:10px}
    #floorLabel{top:82px;left:10px;font-size:10px;padding:3px 8px}
    #objective{max-width:150px;font-size:11px;padding:8px 10px;top:48px;right:10px}
    #objective .t{font-size:9px;letter-spacing:1.5px}
    #progressWrap{width:min(260px,60vw);top:10px}
    #dialogue{bottom:150px;padding:12px 14px;border-radius:12px}
    #speaker{font-size:10px}
    #dtext{font-size:13px;line-height:1.4}
    #prompt{font-size:12px;padding:6px 12px;top:46%}
    #btnStack{right:12px;bottom:16px;gap:10px}
    .tbtn{width:62px;height:62px;font-size:12px}
    .tbtn.small{width:50px;height:50px;font-size:10px}
    #btnInteract{font-size:18px}
    #lookHint{font-size:9px;right:10px}
    #joyBase{width:110px;height:110px}
    #joyKnob{width:48px;height:48px}
    #menu h1{letter-spacing:4px}
    #menuFooter{font-size:9px;letter-spacing:2px}
  }
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. TITEL-PARTIKEL (Canvas)
   ============================================================ */
(function menuParticles(){
  const cv = document.getElementById('menuBG');
  const cx = cv.getContext('2d');
  let parts = [];
  function resize(){
    cv.width = innerWidth; cv.height = innerHeight;
    parts = [];
    const n = Math.min(70, Math.floor(innerWidth/18));
    for(let i=0;i<n;i++){
      parts.push({
        x: Math.random()*cv.width,
        y: Math.random()*cv.height,
        r: Math.random()*1.8 + 0.4,
        vy: -(Math.random()*0.35 + 0.1),
        vx: (Math.random()-0.5)*0.25,
        a: Math.random()*0.5 + 0.15,
        ph: Math.random()*Math.PI*2
      });
    }
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    for(const p of parts){
      p.x += p.vx; p.y += p.vy;
      p.ph += 0.02;
      if(p.y < -10){ p.y = cv.height + 10; p.x = Math.random()*cv.width; }
      if(p.x < -10) p.x = cv.width + 10;
      if(p.x > cv.width+10) p.x = -10;
      const a = p.a * (0.6 + 0.4*Math.sin(p.ph));
      cx.beginPath();
      cx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      cx.fillStyle = `rgba(150,190,255,${a})`;
      cx.shadowColor = 'rgba(120,170,255,0.9)';
      cx.shadowBlur = 10;
      cx.fill();
    }
    cx.shadowBlur = 0;
    requestAnimationFrame(loop);
  }
  resize(); addEventListener('resize', resize); loop();
})();

/* ============================================================
   1. GRUNDGERÜST
   ============================================================ */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const renderer = new THREE.WebGLRenderer({ antialias:!isTouch, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = !isTouch;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x1a2130);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(0x1a2130, 22, 95);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.08, 400);
const world = new THREE.Group(); scene.add(world);

const hemi = new THREE.HemisphereLight(0x9fb4d0, 0x252a33, 0.75); scene.add(hemi);
const amb  = new THREE.AmbientLight(0xffffff, 0.30); scene.add(amb);
const dir  = new THREE.DirectionalLight(0xadc6e6, 0.6);
dir.position.set(-40, 50, 70);
if(!isTouch){
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024,1024);
  dir.shadow.camera.left = -50; dir.shadow.camera.right = 50;
  dir.shadow.camera.top = 50;   dir.shadow.camera.bottom = -50;
  dir.shadow.bias = -0.0005;
}
scene.add(dir);
const fill = new THREE.PointLight(0xffd9a0, 0.4, 60, 2);
fill.position.set(0, 6, 0); scene.add(fill);

function updateCameraFov(){
  const aspect = innerWidth / innerHeight;
  if(aspect < 1){
    const hFov = 100 * Math.PI/180;
    const vFov = 2 * Math.atan(Math.tan(hFov/2) / aspect);
    camera.fov = Math.min(95, vFov * 180/Math.PI);
  } else camera.fov = 68;
  camera.updateProjectionMatrix();
}
updateCameraFov();

/* ============================================================
   2. AUDIO
   ============================================================ */
let audioCtx = null, masterGain = null;
function startAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(audioCtx.destination);

    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.5;
    const g = audioCtx.createGain(); g.gain.value = 0.06;
    src.connect(f).connect(g).connect(masterGain); src.start();

    const drone = audioCtx.createOscillator();
    drone.type = 'sine'; drone.frequency.value = 48;
    const drone2 = audioCtx.createOscillator();
    drone2.type = 'sine'; drone2.frequency.value = 48.7;
    const droneGain = audioCtx.createGain(); droneGain.gain.value = 0.02;
    const droneLp = audioCtx.createBiquadFilter(); droneLp.type='lowpass'; droneLp.frequency.value=200;
    drone.connect(droneLp); drone2.connect(droneLp);
    droneLp.connect(droneGain).connect(masterGain);
    drone.start(); drone2.start();
  }catch(e){}
}
let lastFoot = 0;
function footstep(speed){
  if(!audioCtx || speed < 0.6) return;
  const now = performance.now();
  const interval = speed > 5 ? 210 : 340;
  if(now - lastFoot < interval) return;
  lastFoot = now;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, 700, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<700;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/700, 3);
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 250 + Math.random()*120;
  const g = audioCtx.createGain(); g.gain.value = 0.18;
  s.connect(lp).connect(g).connect(masterGain); s.start(t);
}

/* ============================================================
   3. GEBÄUDE-DATEN
   ============================================================ */
const FLOORS = 3, FH = 4;
const X0 = -32, X1 = 32, Z0 = -12, Z1 = 12;
const CORR = 3.5, T = 0.4;
const RX0 = -26, RX1 = 26, NROOMS = 6;
const roomW = (RX1-RX0)/NROOMS;
const roomEdges = []; for(let i=0;i<=NROOMS;i++) roomEdges.push(RX0 + i*roomW);
const roomCenterX = i => RX0 + (i+0.5)*roomW;
const NAMES_N = ["Klassenzimmer 1","Physik","Chemie","Biologie","Musik","Kunstraum"];
const NAMES_S = ["Mathematik","Deutsch","Englisch","Geschichte","Erdkunde","Bibliothek"];

const colliders = [[],[],[]];
const rooms = [], stairZones = [], interactables = [];
const shadowBlobs = [];

function makeRainStreakTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const x = c.getContext('2d');
  x.clearRect(0,0,128,256);
  for(let i=0;i<40;i++){
    const px = Math.random()*128;
    const py = Math.random()*256;
    const h = 20 + Math.random()*60;
    const grad = x.createLinearGradient(px, py, px, py+h);
    grad.addColorStop(0, 'rgba(200,225,255,0)');
    grad.addColorStop(0.5, 'rgba(200,225,255,'+(0.25+Math.random()*0.3)+')');
    grad.addColorStop(1, 'rgba(200,225,255,0)');
    x.fillStyle = grad;
    x.fillRect(px, py, 1 + Math.random()*1.2, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const rainStreakTex = makeRainStreakTexture();

function makeShadowTexture(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32,32,2,32,32,32);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const shadowTex = makeShadowTexture();
const shadowMat = new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true,
  depthWrite:false, opacity:0.85 });
const shadowGeo = new THREE.PlaneGeometry(0.9, 0.9);

function attachShadow(obj){
  const m = new THREE.Mesh(shadowGeo, shadowMat.clone());
  m.rotation.x = -Math.PI/2;
  m.renderOrder = 1;
  world.add(m);
  shadowBlobs.push({ mesh:m, target:obj, yOff:0.06 });
}

function addWall(floor, x1, z1, x2, z2, y0, y1, mat, collide=true){
  const w = Math.max(Math.abs(x2-x1), 0.01);
  const d = Math.max(Math.abs(z2-z1), 0.01);
  const h = y1 - y0;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set((x1+x2)/2, y0 + h/2, (z1+z2)/2);
  mesh.receiveShadow = !isTouch;
  world.add(mesh);
  if(collide) colliders[floor].push({
    x1:Math.min(x1,x2), z1:Math.min(z1,z2),
    x2:Math.max(x1,x2), z2:Math.max(z1,z2)
  });
  return mesh;
}
function addLightPanel(x, y, z, w, d){
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), M.light);
  p.position.set(x, y, z); world.add(p);
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(1.6, 1.4, 10, 1, true),
    new THREE.MeshBasicMaterial({ color:0xfff0d0, transparent:true, opacity:0.06, side:THREE.DoubleSide, depthWrite:false })
  );
  cone.position.set(x, y-0.75, z);
  world.add(cone);
}
const WINDOW_OFFSET = -1.6;

function buildOuterWallX(floor, zc, winCenters){
  const y0 = floor*FH, y1 = y0 + FH;
  const zA = zc - T/2, zB = zc + T/2;
  winCenters.sort((a,b)=>a-b);
  const xs = [X0-0.2];
  for(const c of winCenters) xs.push(c-1.5, c+1.5);
  xs.push(X1+0.2);
  for(let i=0;i<xs.length;i+=2){
    if(xs[i+1]-xs[i] > 0.01) addWall(floor, xs[i], zA, xs[i+1], zB, y0, y1, M.wallOut);
  }
  const inward = zc > 0 ? -1 : 1;
  for(const c of winCenters){
    addWall(floor, c-1.5, zA, c+1.5, zB, y0, y0+1.1, M.wallOut);
    addWall(floor, c-1.5, zA, c+1.5, zB, y0+2.9, y1, M.wallOut, false);
    const g = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.8), M.glass);
    g.position.set(c, y0+2.0, zc); world.add(g);
    const st = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.8), M.streak.clone());
    st.material.map = rainStreakTex;
    st.position.set(c, y0+2.0, zc + inward*0.02);
    st.userData.rainStreak = true;
    world.add(st);
    const fr = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.06, 0.06), M.metal);
    fr.position.set(c, y0+1.12, zc); world.add(fr);
    const fr2 = fr.clone(); fr2.position.y = y0+2.88; world.add(fr2);
    const fr3 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.8, 0.06), M.metal);
    fr3.position.set(c, y0+2.0, zc); world.add(fr3);
  }
}
function buildOuterWallZ(floor, xc, zc1, zc2){
  const y0 = floor*FH, y1 = y0 + FH;
  addWall(floor, xc - T/2, zc1, xc + T/2, zc2, y0, y1, M.wallOut);
  const inward = xc > 0 ? -1 : 1;
  const zc = (zc1+zc2)/2;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.8), M.glass);
  g.position.set(xc, y0+2.1, zc); g.rotation.y = Math.PI/2; world.add(g);
  const st = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.8), M.streak.clone());
  st.position.set(xc + inward*0.02, y0+2.1, zc);
  st.rotation.y = Math.PI/2; st.userData.rainStreak = true;
  world.add(st);
}
function buildCorridorWall(floor, zc, doorXs){
  const y0 = floor*FH, y1 = y0 + FH;
  const zA = zc - T/2, zB = zc + T/2;
  doorXs.sort((a,b)=>a-b);
  const xs = [X0];
  for(const d of doorXs) xs.push(d-1.1, d+1.1);
  xs.push(X1);
  for(let i=0;i<xs.length;i+=2){
    if(xs[i+1]-xs[i] > 0.01) addWall(floor, xs[i], zA, xs[i+1], zB, y0, y1, M.wall);
  }
  for(const d of doorXs){
    addWall(floor, d-1.1, zA, d+1.1, zB, y0+2.4, y1, M.wall, false);
    const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.4, T+0.06), M.door);
    f1.position.set(d-1.1, y0+1.2, zc); world.add(f1);
    const f2 = f1.clone(); f2.position.x = d+1.1; world.add(f2);
  }
}

function buildSchool(){
  for(let f=0; f<FLOORS; f++){
    const y0 = f*FH;

    const slab = new THREE.Mesh(new THREE.BoxGeometry(X1-X0+1, 0.3, Z1-Z0+1), M.slab);
    slab.position.set(0, y0-0.15, 0);
    slab.receiveShadow = !isTouch;
    world.add(slab);

    const cf = new THREE.Mesh(new THREE.BoxGeometry(X1-X0, 0.04, CORR*2), M.corrFloor);
    cf.position.set(0, y0+0.02, 0); world.add(cf);

    if(f === FLOORS-1){
      const roof = new THREE.Mesh(new THREE.BoxGeometry(X1-X0+1, 0.3, Z1-Z0+1), M.ceil);
      roof.position.set(0, y0+FH+0.15, 0); world.add(roof);
    }

    const northWin = [], southWin = [];
    for(let i=0;i<NROOMS;i++){
      northWin.push(roomCenterX(i) + WINDOW_OFFSET);
      southWin.push(roomCenterX(i) + WINDOW_OFFSET);
    }
    northWin.push(29); northWin.push(-29);
    southWin.push(29); southWin.push(-29);
    buildOuterWallX(f, Z1, northWin);
    buildOuterWallX(f, Z0, southWin);
    buildOuterWallZ(f, X1, Z0, Z1);
    buildOuterWallZ(f, X0, Z0, Z1);

    const doors = [];
    for(let i=0;i<NROOMS;i++) doors.push(roomCenterX(i));
    buildCorridorWall(f,  CORR, doors);
    buildCorridorWall(f, -CORR, doors);

    for(let i=0;i<=NROOMS;i++){
      const x = roomEdges[i];
      addWall(f, x-T/2, CORR, x+T/2, Z1-T/2, y0, y0+FH, M.wall);
      addWall(f, x-T/2, Z0+T/2, x+T/2, -CORR, y0, y0+FH, M.wall);
    }

    for(let i=0;i<NROOMS;i++){
      rooms.push({ floor:f, x1:roomEdges[i], x2:roomEdges[i+1], z1:CORR, z2:Z1-T/2, name:NAMES_N[i] });
      rooms.push({ floor:f, x1:roomEdges[i], x2:roomEdges[i+1], z1:Z0+T/2, z2:-CORR, name:NAMES_S[i] });
    }

    for(let x=-28; x<=28; x+=8) addLightPanel(x, y0+FH-0.12, 0, 2.4, 0.5);
    for(let i=0;i<NROOMS;i++){
      addLightPanel(roomCenterX(i), y0+FH-0.12, 7.5, 2.2, 0.5);
      addLightPanel(roomCenterX(i), y0+FH-0.12, -7.5, 2.2, 0.5);
    }

    for(let i=0;i<NROOMS;i++){
      const cx = roomCenterX(i);
      const bN = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.4, 0.1), M.board);
      bN.position.set(cx + 1.2, y0 + 2.1, Z1 - T/2 - 0.15); world.add(bN);
      const pN = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 0.6), M.desk);
      pN.position.set(cx, y0 + 0.42, Z1 - T/2 - 1.4); world.add(pN);
      const bS = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.4, 0.1), M.board);
      bS.position.set(cx + 1.2, y0 + 2.1, Z0 + T/2 + 0.15); world.add(bS);
      const pS = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.85, 0.6), M.desk);
      pS.position.set(cx, y0 + 0.42, Z0 + T/2 + 1.4); world.add(pS);
    }

    for(const side of [-1, 1]){
      colliders[f].push({
        x1: side<0 ? X0 : 28, z1: -CORR,
        x2: side<0 ? -28 : X1, z2: CORR
      });
    }
  }

  for(const side of [-1, 1]){
    for(let f=0; f<FLOORS-1; f++){
      const baseX = side < 0 ? -27.6 : 27.6;
      const topX  = side < 0 ? X0 + 0.6 : X1 - 0.6;
      const numSteps = 14;
      const risePerStep = FH / numSteps;
      for(let s=0; s<numSteps; s++){
        const t0 = s / numSteps;
        const x0 = baseX + (topX - baseX) * t0;
        const x1 = baseX + (topX - baseX) * ((s+1)/numSteps);
        const stepX = (x0+x1)/2;
        const stepW = Math.abs(x1-x0) + 0.02;
        const stepY = f*FH + (s+1)*risePerStep - risePerStep/2;
        const st = new THREE.Mesh(
          new THREE.BoxGeometry(stepW, risePerStep, CORR*2 - 0.5), M.stair);
        st.position.set(stepX, stepY, 0); world.add(st);
      }
      for(const zs of [-1, 1]){
        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(Math.abs(topX - baseX) + 0.1, 0.08, 0.08), M.rail);
        rail.position.set((baseX + topX) / 2, f*FH + FH/2 + 0.85, zs * (CORR - 0.35));
        rail.rotation.z = Math.atan2(FH, Math.abs(topX - baseX)) * (side < 0 ? 1 : -1);
        world.add(rail);
      }
    }
    for(let f=0; f<FLOORS; f++){
      stairZones.push({
        floor:f, side,
        x1: side<0 ? X0 : 26, x2: side<0 ? -26 : X1,
        z1: -CORR, z2: CORR
      });
      const mark = new THREE.Mesh(
        new THREE.PlaneGeometry(5.5, CORR*2-0.4),
        new THREE.MeshBasicMaterial({ color:0x2b6bff, transparent:true, opacity:0.15 })
      );
      mark.rotation.x = -Math.PI/2;
      mark.position.set(side<0 ? -29 : 29, f*FH+0.06, 0);
      world.add(mark);
    }
  }

  const lockedDoors = [
    { floor:2, x:roomCenterX(3), z: CORR, name:'Lehrerzimmer' },
    { floor:1, x:roomCenterX(5), z:-CORR, name:'Bibliothek'  },
  ];
  for(const d of lockedDoors){
    const y0 = d.floor*FH;
    const door = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.4, 0.12), M.doorLock);
    door.position.set(d.x, y0+1.2, d.z); world.add(door);
    colliders[d.floor].push({ x1:d.x-1.05, z1:d.z-0.35, x2:d.x+1.05, z2:d.z+0.35 });
    interactables.push({
      floor:d.floor, x:d.x, z:d.z, r:2.4,
      label:`Tür – ${d.name}`,
      action:()=> say('', 'Abgeschlossen. Diese Tür ist verschlossen.', 2.4)
    });
  }
}

function makeCharacter(o={}){
  const g = new THREE.Group();
  const skin  = new THREE.MeshStandardMaterial({ color:o.skin  ?? 0xe8b58a, roughness:0.85 });
  const shirt = new THREE.MeshStandardMaterial({ color:o.shirt ?? 0x2f6fb8, roughness:0.9 });
  const pants = new THREE.MeshStandardMaterial({ color:o.pants ?? 0x2b3342, roughness:0.95 });
  const hair  = new THREE.MeshStandardMaterial({ color:o.hair  ?? 0x3a2a1e, roughness:0.9 });
  const shoe  = new THREE.MeshStandardMaterial({ color:o.shoe  ?? 0xeaeaea, roughness:0.75 });
  const dark  = new THREE.MeshStandardMaterial({ color:0x14181f, roughness:0.5 });

  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.22,0.26), pants);
  hips.position.y = 0.92; g.add(hips);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.60,0.30), shirt);
  torso.position.y = 1.32; g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19,20,16), skin);
  head.position.y = 1.80; head.scale.set(1,1.08,1); g.add(head);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.202,20,16), hair);
  cap.position.y = 1.84; cap.scale.set(1,0.78,1.02); g.add(cap);
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.20,16,12), hair);
  back.position.set(0,1.80,-0.03); back.scale.set(0.98,0.95,0.98); g.add(back);
  for(const sx of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028,10,8), dark);
    eye.position.set(sx*0.072, 1.81, 0.172); g.add(eye);
  }
  function limb(px, py, w, h, mat, matEnd, endSize){
    const pivot = new THREE.Group();
    pivot.position.set(px, py, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,w), mat);
    m.position.y = -h/2; pivot.add(m);
    const e = new THREE.Mesh(new THREE.BoxGeometry(endSize,endSize,endSize), matEnd);
    e.position.y = -h - endSize*0.3; pivot.add(e);
    g.add(pivot); return pivot;
  }
  const armL = limb(-0.33, 1.56, 0.14, 0.52, shirt, skin, 0.13);
  const armR = limb( 0.33, 1.56, 0.14, 0.52, shirt, skin, 0.13);
  const legL = limb(-0.14, 0.90, 0.17, 0.80, pants, shoe, 0.15);
  const legR = limb( 0.14, 0.90, 0.17, 0.80, pants, shoe, 0.15);
  legL.children[1].scale.set(1,0.7,1.9);
  legR.children[1].scale.set(1,0.7,1.9);
  const bag = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.42,0.18),
    new THREE.MeshStandardMaterial({ color:o.bag ?? 0x1e2530, roughness:0.9 }));
  bag.position.set(0,1.34,-0.22); g.add(bag);

  if(!isTouch){
    g.traverse(m => { if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  }

  g.userData = { armL, armR, legL, legR, torso, baseY:0 };
  return g;
}

function applyPose(ch, sitBlend, animT, speed){
  const u = ch.userData;
  const walkAmp = Math.min(speed/4.2, 1) * (1 - sitBlend);
  const s = Math.sin(animT*11) * walkAmp;
  u.legL.rotation.x = -1.55*sitBlend + s*0.85;
  u.legR.rotation.x = -1.55*sitBlend - s*0.85;
  u.armL.rotation.x = -1.15*sitBlend - s*0.70;
  u.armR.rotation.x = -1.15*sitBlend + s*0.70;
  u.torso.position.y = 1.32 + Math.abs(Math.sin(animT*11))*0.035*walkAmp;
  u.torso.rotation.y = -s*0.08;
  ch.position.y = u.baseY - 0.46*sitBlend;
}

/* ============================================================
   10. KOLLISION
   ============================================================ */
function pushOut(px, pz, r, c){
  const cx = Math.max(c.x1, Math.min(px, c.x2));
  const cz = Math.max(c.z1, Math.min(pz, c.z2));
  const dx = px-cx, dz = pz-cz;
  const d2 = dx*dx + dz*dz;
  if(d2 > r*r) return null;
  if(d2 > 1e-8){
    const d = Math.sqrt(d2);
    return [px + dx/d*(r-d), pz + dz/d*(r-d)];
  }
  const left = px-c.x1, right = c.x2-px, top = pz-c.z1, bot = c.z2-pz;
  const m = Math.min(left,right,top,bot);
  if(m===left)  return [c.x1-r, pz];
  if(m===right) return [c.x2+r, pz];
  if(m===top)   return [px, c.z1-r];
  return [px, c.z2+r];
}
function collide(px, pz, floor){
  const r = player.radius;
  for(const c of colliders[floor]){
    const res = pushOut(px, pz, r, c);
    if(res){ px = res[0]; pz = res[1]; }
  }
  return [px, pz];
}

let menuOpen = true;
function setObjective(txt){ elObj.textContent = txt; }
function setProgress(p, label){
  elProgFill.style.width = Math.round(p*100) + '%';
  elProgText.textContent = label + ' · ' + Math.round(p*100) + '%';
}

let dq = [], dTimer = 0, dActive = false;
function say(speaker, text, dur=3.5){
  dq.push({ speaker, text, dur });
  if(!dActive) nextDialogue();
}
function nextDialogue(){
  if(dq.length === 0){ dActive = false; elDia.classList.remove('show'); return; }
  dActive = true;
  const d = dq.shift();
  elSpeaker.textContent = d.speaker || '';
  elDtext.textContent = d.text;
  elDia.classList.add('show');
  dTimer = d.dur;
}
function updateDialogue(dt){
  if(!dActive) return;
  dTimer -= dt;
  if(dTimer <= 0) nextDialogue();
}
function fadeOut(cb){
  elFade.style.opacity = '1';
  setTimeout(()=>{ cb && cb(); setTimeout(()=> elFade.style.opacity='0', 130); }, 400);
}

/* ============================================================
   12. INTERAKTION
   ============================================================ */
let currentInteract = null;
let elBtnInteractRef = null;

function doInteract(){
  if(menuOpen) return;
  if(currentInteract && currentInteract.action) currentInteract.action();
}
function updateInteract(){
  if(player.state !== 'free'){
    elPrompt.classList.remove('show'); currentInteract = null;
    if(elBtnInteractRef){ elBtnInteractRef.classList.add('disabled'); elBtnInteractRef.classList.remove('glow'); }
    return;
  }
  let best = null, bestD = 1e9;
  for(const it of interactables){
    if(it.floor !== player.floor) continue;
    const d = Math.hypot(it.x-player.x, it.z-player.z);
    if(d < it.r && d < bestD){ best = it; bestD = d; }
  }
  for(const sz of stairZones){
    if(sz.floor !== player.floor || !stairReady) continue;
    if(player.x > Math.min(sz.x1,sz.x2) && player.x < Math.max(sz.x1,sz.x2)
       && player.z > sz.z1 && player.z < sz.z2){
      const up = player.floor < FLOORS-1;
      const down = player.floor > 0;
      if(up || down){
        best = { floor:sz.floor, x:player.x, z:player.z, r:99,
                 label: up ? 'Treppe hinauf' : 'Treppe hinunter',
                 action:()=> useStairs(up ? 1 : -1) };
        bestD = 0;
      }
    }
  }
  currentInteract = best;
  if(best){
    elPrompt.innerHTML = `<b>[E]</b> ${best.label}`;
    elPrompt.classList.add('show');
    if(elBtnInteractRef){ elBtnInteractRef.classList.remove('disabled'); elBtnInteractRef.classList.add('glow'); }
  } else {
    elPrompt.classList.remove('show');
    if(elBtnInteractRef){ elBtnInteractRef.classList.add('disabled'); elBtnInteractRef.classList.remove('glow'); }
  }
}

/* ============================================================
   12b. TREPPEN — mit Avatar-Ausblenden (NEU)
   ============================================================ */
let stairReady = true;
function useStairs(dir){
  const nf = player.floor + dir;
  if(nf < 0 || nf >= FLOORS) return;
  stairReady = false;

  // Avatar sofort ausblenden (während des Fades)
  player.char.visible = false;
  // Schatten des Spielers ebenfalls verstecken
  for(const s of shadowBlobs){
    if(s.target === player.char) s.mesh.visible = false;
  }

  fadeOut(()=>{
    player.floor = nf;
    player.y = nf*FH;
    const isRight = player.x > 0;
    player.x = isRight ? 24 : -24;
    player.z = 0;

    // Avatar an der neuen Position anzeigen
    player.char.position.x = player.x;
    player.char.position.z = player.z;
    player.char.position.y = player.y;

    elFloor.textContent = 'STOCK ' + nf;
    say('', dir > 0 ? `Du gehst die Treppe hinauf in den ${nf}. Stock.`
                    : `Du gehst die Treppe hinunter in den ${nf}. Stock.`, 2.2);

    // Nach kurzer Verzögerung Avatar zeigen + Kamera sauber nachsetzen
    setTimeout(()=>{
      player.char.visible = true;
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      const dx = Math.sin(camYaw)*cp, dz = Math.cos(camYaw)*cp;
      camera.position.set(
        player.x + dx*CAM_DIST,
        player.y + 1.55 + sp*CAM_DIST,
        player.z + dz*CAM_DIST
      );
    }, 200);
  });
}

  rainStreakTex.offset.y = (rainStreakTex.offset.y + dt*0.35) % 1;

const mm = document.getElementById('minimap');
const mmctx = mm.getContext('2d');
let MMS = 4.0, MMPX = 22, MMPZ = 17;
let wx, wz;
function updateMinimapScale(){
  const r = mm.getBoundingClientRect();
  mm.width  = Math.max(120, Math.round(r.width  * devicePixelRatio));
  mm.height = Math.max(60,  Math.round(r.height * devicePixelRatio));
  const w = mm.width, h = mm.height;
  const spanX = X1 - X0, spanZ = Z1 - Z0;
  MMS = Math.min((w - 20) / spanX, (h - 20) / spanZ);
  MMPX = (w - spanX*MMS) / 2;
  MMPZ = (h - spanZ*MMS) / 2;
  wx = x => (x - X0)*MMS + MMPX;
  wz = z => (Z1 - z)*MMS + MMPZ;
  mmctx.setTransform(1,0,0,1,0,0);
}
wx = x => (x - X0)*MMS + MMPX;
wz = z => (Z1 - z)*MMS + MMPZ;

function drawMinimap(){
  const f = player.floor;
  mmctx.clearRect(0,0,mm.width,mm.height);
  mmctx.fillStyle = 'rgba(8,12,20,0.9)';
  mmctx.beginPath();
  if(mmctx.roundRect) mmctx.roundRect(0,0,mm.width,mm.height,14*devicePixelRatio);
  else mmctx.rect(0,0,mm.width,mm.height);
  mmctx.fill();

  mmctx.fillStyle = 'rgba(40,55,80,0.7)';
  mmctx.fillRect(wx(X0), wz(Z1), (X1-X0)*MMS, (Z1-Z0)*MMS);

  mmctx.fillStyle = 'rgba(140,180,255,0.55)';
  for(const c of colliders[f]){
    mmctx.fillRect(wx(c.x1), wz(c.z2), (c.x2-c.x1)*MMS, (c.z2-c.z1)*MMS);
  }

  mmctx.fillStyle = 'rgba(120,200,255,0.4)';
  mmctx.fillRect(wx(X0+1), wz(CORR), 5*MMS, CORR*2*MMS);
  mmctx.fillRect(wx(X1-6), wz(CORR), 5*MMS, CORR*2*MMS);

  mmctx.fillStyle = 'rgba(255,200,120,0.7)';
  for(const n of npcs){
    if(n.floor !== f) continue;
    mmctx.beginPath();
    mmctx.arc(wx(n.x), wz(n.z), 1.6*devicePixelRatio, 0, Math.PI*2);
    mmctx.fill();
  }

  const px = wx(player.x), py = wz(player.z);
  const fx = Math.sin(player.rot), fz = Math.cos(player.rot);
  const dp = devicePixelRatio;
  mmctx.save();
  mmctx.translate(px, py);
  mmctx.beginPath();
  mmctx.moveTo(fx*7*dp, -fz*7*dp);
  mmctx.lineTo(-fz*4.5*dp - fx*3*dp,  fx*4.5*dp + fz*3*dp);
  mmctx.lineTo( fz*4.5*dp - fx*3*dp, -fx*4.5*dp + fz*3*dp);
  mmctx.closePath();
  mmctx.fillStyle = '#6fa8ff';
  mmctx.shadowColor = '#4d8dff'; mmctx.shadowBlur = 12*dp;
  mmctx.fill();
  mmctx.restore();
}

const npcs = [];
function spawnHallNPCs(){
  const colors = [0xb84f4f,0x4f9b6a,0x8a5fb8,0xb8873f,0x3d7f8f,0x2f6fb8,0xa04040,0x60a080];
  const hairs  = [0x3a2a1e,0x1e1a16,0x6b4a2a,0x8a5c2a,0x2b2b2b,0xddc088];
  for(let f=0; f<FLOORS; f++){
    for(let i=0; i<3; i++){
      const x = -24 + i*18 + Math.random()*4;
      const z = (i%2 === 0 ? 1 : -1) * (1 + Math.random()*1.2);
      const c = makeCharacter({
        shirt: colors[(f*3+i) % colors.length],
        hair:  hairs[(f*3+i) % hairs.length],
        pants: 0x2b3342
      });
      c.position.set(x, f*FH, z);
      c.userData.baseY = f*FH;
      world.add(c);
      attachShadow(c);
      const dir = (i % 2 === 0) ? 1 : -1;
      npcs.push({
        char: c, floor: f, x, z, dir,
        speed: 1.4 + Math.random()*0.8,
        targetX: dir > 0 ? X1 - 6 : X0 + 6,
        pauseTimer: Math.random()*2,
        walkT: Math.random()*10,
        shadow: shadowBlobs[shadowBlobs.length-1]
      });
    }
  }
}

function updateNPCs(dt){
  for(const n of npcs){
    if(n.pauseTimer > 0){
      n.pauseTimer -= dt;
      applyPose(n.char, 0, n.walkT, 0);
      continue;
    }
    const dx = n.targetX - n.x;
    if(Math.abs(dx) < 0.3){
      n.dir *= -1;
      n.targetX = n.dir > 0 ? X1 - 6 : X0 + 6;
      n.pauseTimer = 1 + Math.random()*2.5;
      continue;
    }
    const sign = Math.sign(dx);
    n.x += sign * n.speed * dt;
    n.walkT += dt;
    n.char.position.x = n.x;
    n.char.rotation.y = sign > 0 ? Math.PI/2 : -Math.PI/2;
    applyPose(n.char, 0, n.walkT, n.speed);
  }
}

   17. STORY
   ============================================================ */
let storyStarted = false, introTimer = 0, introStage = 0;
let camDrift = 0;

function triggerClassmatesLeave(){
  for(const cm of classmates){
    if(cm.state === 'sitting'){ cm.state = 'standing'; cm.standT = 0; }
  }
}

function updateClassmates(dt){
  for(const cm of classmates){
    if(cm.state === 'sitting') continue;
    if(cm.state === 'standing'){
      cm.standT = (cm.standT || 0) + dt;
      cm.sitBlend = Math.max(0, 1 - cm.standT / 1.2);
      applyPose(cm.char, cm.sitBlend, 0, 0);
      if(cm.standT > 1.2){ cm.state = 'walking'; cm.walkT = 0; }
    } else if(cm.state === 'walking'){
      const doorZ = CORR + 0.4;
      const dz = doorZ - cm.z;
      if(Math.abs(dz) < 0.15){
        cm.state = 'gone';
        cm.char.visible = false;
        if(cm.shadow) cm.shadow.mesh.visible = false;
        continue;
      }
      const sign = Math.sign(dz);
      cm.z += sign * 2.6 * dt;
      cm.walkT += dt;
      cm.char.position.z = cm.z;
      cm.char.rotation.y = Math.PI;
      applyPose(cm.char, 0, cm.walkT, 2.6);
    }
  }
}

function updateStory(dt){
  if(!storyStarted) return;
  introTimer += dt;

  if(introStage === 0 && introTimer > 0.7){
    introStage = 1;
    say('FRAU BERGER', 'So … wer kann mir nochmal erklären, warum der Satz des Pythagoras funktioniert?', 4.2);
    say('FRAU BERGER', 'Jonas? Nein? Dann machen wir es nochmal gemeinsam …', 3.8);
    setProgress(0.15, 'KAPITEL 1');
    elProgWrap.classList.add('show');
  }
  if(introStage === 1 && introTimer > 10){
    introStage = 2;
    say('', '📢 Durchsage: Wegen des starken Regens ist ab jetzt Regenpause. Alle Schülerinnen und Schüler bleiben im Gebäude.', 6);
    setObjective('Steh auf und verlasse das Klassenzimmer.');
    triggerClassmatesLeave();
    setProgress(0.30, 'KAPITEL 1');
  }
  if(introStage === 2 && introTimer > 13.5){
    introStage = 3;
    player.state = 'standing-up';
    player.sitTarget = 0;
    say('', 'Du stehst langsam auf und gehst zur Tür.', 2.6);
    setProgress(0.45, 'KAPITEL 1');
  }
}

   18. LOOP
   ============================================================ */
const clock = new THREE.Clock();
let animT = 0, walkBobT = 0;

function updateShadows(){
  for(const s of shadowBlobs){
    if(!s.target.visible){ s.mesh.visible = false; continue; }
    s.mesh.visible = true;
    const baseY = s.target.userData.baseY;
    s.mesh.position.set(s.target.position.x, baseY + 0.06, s.target.position.z);
    s.mesh.rotation.x = -Math.PI/2;
    const scale = 0.85;
    s.mesh.scale.set(scale, scale, scale);
  }
}

function updatePlayer(dt){
  player.sitBlend += (player.sitTarget - player.sitBlend) * Math.min(1, dt*3.5);

  if(player.state === 'standing-up' && player.sitBlend < 0.05){
    player.sitBlend = 0;
    player.state = 'free';
    setObjective('Verlasse das Klassenzimmer und geh auf den Flur.');
    say('', 'Du kannst dich jetzt frei bewegen.', 3);
  }

  const lookSpeed = 1.8;
  if(keys['ArrowLeft'])  camYaw   += lookSpeed * dt;
  if(keys['ArrowRight']) camYaw   -= lookSpeed * dt;
  if(keys['ArrowUp'])    camPitch -= lookSpeed * 0.6 * dt;
  if(keys['ArrowDown'])  camPitch += lookSpeed * 0.6 * dt;
  camPitch = Math.max(-0.75, Math.min(1.05, camPitch));

  let ix = 0, iz = 0;
  if(player.state === 'free'){
    const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
    const rgtX = -fwdZ,             rgtZ =  fwdX;
    if(keys['KeyW']) { ix += fwdX; iz += fwdZ; }
    if(keys['KeyS']) { ix -= fwdX; iz -= fwdZ; }
    if(keys['KeyD']) { ix += rgtX; iz += rgtZ; }
    if(keys['KeyA']) { ix -= rgtX; iz -= rgtZ; }
    if(Math.abs(input.moveX) > 0.02 || Math.abs(input.moveZ) > 0.02){
      ix += fwdX * (-input.moveZ) + rgtX * input.moveX;
      iz += fwdZ * (-input.moveZ) + rgtZ * input.moveX;
    }
  }

  const len = Math.hypot(ix, iz);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || input.sprint;
  const maxSpeed = sprint ? 6.4 : 3.6;

  if(len > 0.001){
    ix /= len; iz /= len;
    player.speed += (maxSpeed - player.speed) * Math.min(1, dt*10);
  } else {
    player.speed += (0 - player.speed) * Math.min(1, dt*12);
  }

  let nx = player.x + ix * player.speed * dt;
  let nz = player.z + iz * player.speed * dt;
  [nx, nz] = collide(nx, nz, player.floor);
  player.x = nx; player.z = nz;

  if(len > 0.001){
    const target = Math.atan2(ix, iz);
    let d = target - player.rot;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    player.rot += d * Math.min(1, dt*14);
  }

  player.y = player.floor * FH;
  player.char.position.x = player.x;
  player.char.position.z = player.z;
  player.char.rotation.y = player.rot;
  applyPose(player.char, player.sitBlend, animT, player.speed);

  if(player.speed > 1 && player.state === 'free'){
    walkBobT += player.speed * dt;
    footstep(player.speed);
  }

  const isSprint = sprint && player.speed > 4.5 && player.state === 'free';
  elSpeedFx.classList.toggle('on', isSprint);

  if(!stairReady){
    let inside = false;
    for(const sz of stairZones){
      if(sz.floor !== player.floor) continue;
      if(player.x > Math.min(sz.x1,sz.x2) && player.x < Math.max(sz.x1,sz.x2)
         && player.z > sz.z1 && player.z < sz.z2) inside = true;
    }
    if(!inside) stairReady = true;
  }
}

function updateCamera(dt){
  const tx = player.x, ty = player.y + 1.55, tz = player.z;

  if(storyStarted && introStage < 3){
    camDrift += dt * 0.35;
    camYaw = Math.PI + Math.sin(camDrift*0.7) * 0.05;
    camPitch = 0.22 + Math.sin(camDrift*0.9) * 0.03;
  }

  const aspect = innerWidth / innerHeight;
  let baseFov;
  if(aspect < 1){
    const hFov = 100 * Math.PI/180;
    const vFov = 2 * Math.atan(Math.tan(hFov/2) / aspect);
    baseFov = Math.min(95, vFov * 180/Math.PI);
  } else baseFov = 68;
  const isSprint = (keys['ShiftLeft'] || keys['ShiftRight'] || input.sprint) && player.speed > 4.5;
  const targetFov = baseFov + (isSprint ? 7 : 0);
  if(Math.abs(camera.fov - targetFov) > 0.05){
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt*6);
    camera.updateProjectionMatrix();
  }

  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const dx = Math.sin(camYaw)*cp, dy = sp, dz = Math.cos(camYaw)*cp;

  const target = new THREE.Vector3(tx, ty, tz);
  let maxT = CAM_DIST;
  const steps = 12;
  for(let i=1;i<=steps;i++){
    const t = CAM_DIST*i/steps;
    const px = tx + dx*t, pz = tz + dz*t;
    let hit = false;
    for(const c of colliders[player.floor]){
      if(px > c.x1-0.3 && px < c.x2+0.3 && pz > c.z1-0.3 && pz < c.z2+0.3){ hit = true; break; }
    }
    if(hit){ maxT = Math.max(1.1, CAM_DIST*(i-1)/steps - 0.15); break; }
  }

  let cx = tx + dx*maxT, cy = ty + dy*maxT, cz = tz + dz*maxT;

  if(player.speed > 0.6 && player.state === 'free'){
    const bobAmp = Math.min(player.speed/6, 1) * 0.035;
    cy += Math.sin(walkBobT * 2) * bobAmp;
    cx += Math.cos(walkBobT) * bobAmp * 0.4;
  }

  if(isSprint){
    camShakeT += dt;
    const shake = 0.02;
    cx += (Math.random()-0.5) * shake;
    cy += (Math.random()-0.5) * shake;
    cz += (Math.random()-0.5) * shake;
  }

  const clampedY = Math.max(player.y + 0.7, Math.min(player.y + FH - 0.35, cy));
  camera.position.lerp(new THREE.Vector3(cx, clampedY, cz), Math.min(1, dt*16));
  camera.lookAt(target);
}

function updateRoomLabel(){
  let name = 'Flur';
  if(Math.abs(player.z) < CORR){
    if(player.x > 26 || player.x < -26) name = 'Treppenhaus';
    else name = 'Flur';
  }
  for(const r of rooms){
    if(r.floor !== player.floor) continue;
    if(player.x > r.x1 && player.x < r.x2 && player.z > r.z1 && player.z < r.z2){
      name = r.name; break;
    }
  }
  elFloor.textContent = 'STOCK ' + player.floor + ' · ' + name;
}

function loop(){
  const dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;

  if(!menuOpen){
    updatePlayer(dt);
    updateCamera(dt);
    updateInteract();
    updateRoomLabel();
    updateDialogue(dt);
    updateStory(dt);
    updateClassmates(dt);
    updateNPCs(dt);
    updateShadows();
  }

  updateRain(dt);
  updateLightning(dt);
  updateDust(dt, animT);
  drawMinimap();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);

function handleResize(){
  camera.aspect = innerWidth/innerHeight;
  updateCameraFov();
  renderer.setSize(innerWidth, innerHeight);
  setTimeout(()=>{ updateMinimapScale(); }, 60);
}
addEventListener('resize', handleResize);
addEventListener('orientationchange', ()=> setTimeout(handleResize, 150));

/* ============================================================
   20. TOUCH
   ============================================================ */
const touchUI = document.getElementById('touchUI');
const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const lookZone = document.getElementById('lookZone');
const lookHint = document.getElementById('lookHint');
const btnInteract = document.getElementById('btnInteract');
const btnSprint = document.getElementById('btnSprint');
elBtnInteractRef = btnInteract;

let joyActive = false, joyId = null;
let joyCenter = { x:0, y:0 };
let JOY_RADIUS = 58;
let lookId = null, lookLast = { x:0, y:0 };

function refreshJoyRadius(){
  const r = joyBase.getBoundingClientRect();
  JOY_RADIUS = (r.width || 120) * 0.42;
}

function bindTouchControls(){
  if(!isTouch) return;
  touchUI.classList.add('active');
  refreshJoyRadius();

  joyZone.addEventListener('touchstart', e=>{
    if(menuOpen) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier; joyActive = true;
    joyCenter.x = t.clientX; joyCenter.y = t.clientY;
    joyBase.style.left = t.clientX + 'px'; joyBase.style.top  = t.clientY + 'px';
    joyKnob.style.left = t.clientX + 'px'; joyKnob.style.top  = t.clientY + 'px';
    joyBase.classList.add('on'); joyKnob.classList.add('on');
    refreshJoyRadius();
  }, {passive:false});

  joyZone.addEventListener('touchmove', e=>{
    if(!joyActive) return;
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier !== joyId) continue;
      let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
      joyKnob.style.left = (joyCenter.x + dx) + 'px';
      joyKnob.style.top  = (joyCenter.y + dy) + 'px';
      input.moveX = dx / JOY_RADIUS;
      input.moveZ = dy / JOY_RADIUS;
    }
  }, {passive:false});

  function endJoy(e){
    for(const t of e.changedTouches){
      if(t.identifier !== joyId) continue;
      joyActive = false; joyId = null;
      input.moveX = 0; input.moveZ = 0;
      joyBase.classList.remove('on'); joyKnob.classList.remove('on');
    }
  }
  joyZone.addEventListener('touchend', endJoy);
  joyZone.addEventListener('touchcancel', endJoy);

  lookZone.addEventListener('touchstart', e=>{
    if(menuOpen) return;
    e.preventDefault();
    if(lookId !== null) return;
    const t = e.changedTouches[0];
    lookId = t.identifier;
    lookLast.x = t.clientX; lookLast.y = t.clientY;
    lookHint.style.opacity = '0';
  }, {passive:false});

  lookZone.addEventListener('touchmove', e=>{
    if(lookId === null) return;
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier !== lookId) continue;
      const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
      lookLast.x = t.clientX; lookLast.y = t.clientY;
      camYaw   -= dx * 0.005;
      camPitch += dy * 0.004;
      camPitch = Math.max(-0.75, Math.min(1.05, camPitch));
    }
  }, {passive:false});

  function endLook(e){
    for(const t of e.changedTouches){
      if(t.identifier !== lookId) continue;
      lookId = null;
    }
  }
  lookZone.addEventListener('touchend', endLook);
  lookZone.addEventListener('touchcancel', endLook);

  btnInteract.addEventListener('touchstart', e=>{
    e.preventDefault(); e.stopPropagation();
    btnInteract.classList.add('pressed'); doInteract();
  }, {passive:false});
  btnInteract.addEventListener('touchend', e=>{
    e.preventDefault(); e.stopPropagation();
    btnInteract.classList.remove('pressed');
  }, {passive:false});

  btnSprint.addEventListener('touchstart', e=>{
    e.preventDefault(); e.stopPropagation();
    input.sprint = true; btnSprint.classList.add('pressed');
  }, {passive:false});
  btnSprint.addEventListener('touchend', e=>{
    e.preventDefault(); e.stopPropagation();
    input.sprint = false; btnSprint.classList.remove('pressed');
  }, {passive:false});
  btnSprint.addEventListener('touchcancel', ()=>{
    input.sprint = false; btnSprint.classList.remove('pressed');
  });

  document.addEventListener('gesturestart', e=> e.preventDefault());
  document.addEventListener('dblclick', e=> e.preventDefault());
  elControls.style.display = 'none';
}

/* ============================================================
   21. START
   ============================================================ */
buildSchool();
buildIntroScene();
spawnHallNPCs();
applyPose(player.char, 1, 0, 0);
updateMinimapScale();
bindTouchControls();

function startGame(){
  const menu = document.getElementById('menu');
  if(menu) menu.style.display = 'none';
  menuOpen = false;
  startAudio();
  storyStarted = true;
  introTimer = 0; introStage = 0; camDrift = 0;
  setObjective('Hör dem Unterricht zu.');
  setProgress(0, 'KAPITEL 1');

  if(!isTouch){
    setTimeout(()=>{ elControls.style.opacity = '0'; }, 8000);
    setTimeout(()=>{
      if(renderer.domElement && !document.pointerLockElement)
        renderer.domElement.requestPointerLock();
    }, 120);
  }
}

document.getElementById('ch1').addEventListener('click', startGame);
document.getElementById('ch1').addEventListener('touchend', (e)=>{
  e.preventDefault(); startGame();
}, {passive:false});
