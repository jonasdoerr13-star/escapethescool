<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeLingo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #131F24; color: white;
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 450px; height: 100vh;
            display: flex; flex-direction: column; position: relative;
            background-color: #131F24;
        }

        /* --- ONBOARDING (Name) --- */
        #onboarding {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 100;
            display: flex; flex-direction: column; padding: 40px 20px; text-align: center;
        }
        #onboarding h1 { font-size: 26px; margin-top: 40px; margin-bottom: 10px; }
        #onboarding p { color: #AFAFAF; margin-bottom: 20px; }
        
        input[type="text"] {
            width: 100%; padding: 15px; background-color: #202F36;
            border: 2px solid #3C4B53; border-radius: 12px; color: white;
            font-size: 18px; font-weight: bold; margin-bottom: 20px; outline: none;
            text-align: center;
        }
        input[type="text"]:focus { border-color: #1CB0F6; }

        .start-btn {
            background-color: #58CC02; color: #131F24; border: none; border-bottom: 4px solid #46A302;
            padding: 15px; border-radius: 12px; font-weight: 900; font-size: 18px;
            cursor: pointer; transition: 0.1s; width: 100%; margin-top: 20px;
        }
        .start-btn:active { transform: translateY(4px); border-bottom: none; }

        /* --- HAUPT-APP --- */
        #main-app { display: none; flex-direction: column; height: 100%; }

        /* Obere Leiste */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; font-size: 18px; font-weight: 900;
            z-index: 10; background-color: #131F24;
        }
        .stat { display: flex; align-items: center; gap: 5px; }
        .stat.streak { color: #FF9600; }
        .stat.gems { color: #1CB0F6; }
        
        .course-switcher-btn {
            background-color: transparent; border: none; color: #AFAFAF;
            font-size: 24px; cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        /* Scrollbarer Inhalt */
        .content-area {
            flex: 1; overflow-y: auto; padding: 0 0 100px 0;
            display: flex; flex-direction: column; position: relative;
        }

        /* Ansichten */
        .view { display: none; flex-direction: column; }
        .view.active { display: flex; }

        /* --- DUOLINGO-STYLE PFAD --- */
        .path-container { display: flex; flex-direction: column; position: relative; width: 100%; padding-top: 20px; }
        
        /* Der Stufen-Header (z.B. das grüne Kästchen) */
        .unit-header {
            width: 90%; margin: 0 auto 30px auto; padding: 15px 20px;
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
            color: #131F24; box-shadow: 0 4px 0 rgba(0,0,0,0.2); position: sticky; top: 10px; z-index: 5;
        }
        .unit-header h2 { font-size: 14px; font-weight: 900; text-transform: uppercase; opacity: 0.8; }
        .unit-header p { font-size: 18px; font-weight: 900; margin-top: 2px; }
        .unit-header .icon { font-size: 24px; opacity: 0.8; }

        .bg-green { background-color: #58CC02; }
        .bg-purple { background-color: #CE82FF; }
        .bg-blue { background-color: #1CB0F6; }
        .bg-orange { background-color: #FF9600; }
        .bg-red { background-color: #FF4B4B; }

        /* Die Level-Kreise */
        .node-wrapper { position: relative; margin-bottom: 25px; display: flex; justify-content: center; width: 100%; z-index: 2; }
        
        /* Geschwungener Pfad (abwechselnd links und rechts) */
        .node-wrapper:nth-child(4n+2) { transform: translateX(50px); }
        .node-wrapper:nth-child(4n+3) { transform: translateX(-50px); }
        .node-wrapper:nth-child(4n+4) { transform: translateX(0px); }

        .node {
            width: 75px; height: 75px; border-radius: 50%;
            border: none; display: flex; justify-content: center; align-items: center;
            font-size: 32px; cursor: pointer; transition: all 0.1s;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3); position: relative;
        }
        .node:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        
        /* Aktiver/Abgeschlossener Knoten (Grün) */
        .node.active { background-color: #58CC02; color: white; }
        /* Gesperrter Knoten (Grau) */
        .node.locked { background-color: #2A353B; color: #52656D; box-shadow: 0 8px 0 #131F24; cursor: not-allowed; }

        /* Der Tooltip "Hierhin springen?" */
        .tooltip {
            position: absolute; top: -45px; background-color: #131F24;
            color: #58CC02; padding: 8px 15px; border-radius: 12px;
            font-weight: 900; font-size: 14px; border: 2px solid #3C4B53;
            z-index: 10; white-space: nowrap;
        }
        .tooltip::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #3C4B53 transparent transparent transparent;
        }

        /* Die grauen Charaktere / Truhen im Hintergrund */
        .bg-deco {
            position: absolute; font-size: 60px; opacity: 0.1; z-index: 1; pointer-events: none;
        }

        /* --- SPRACHAUSWAHL MODAL --- */
        #lang-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 200; padding: 20px; flex-direction: column;
            overflow-y: auto;
        }
        .lang-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .lang-title { font-size: 24px; font-weight: 900; }
        
        .lang-section { margin-bottom: 25px; }
        .lang-section h3 { font-size: 14px; color: #AFAFAF; text-transform: uppercase; margin-bottom: 10px; }
        
        .course-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; border-radius: 15px; border: 2px solid #3C4B53;
            margin-bottom: 10px; cursor: pointer; transition: 0.1s;
        }
        .course-item:active { background-color: #202F36; }
        .course-item.selected { border-color: #1CB0F6; background-color: rgba(28, 176, 246, 0.1); }
        
        .course-info { display: flex; align-items: center; gap: 15px; }
        .course-icon { font-size: 30px; }
        .course-name { font-size: 18px; font-weight: 800; }
        .course-type { font-size: 12px; color: #AFAFAF; }

        /* --- SOCIAL / PROFIL --- */
        .page-padding { padding: 20px; }
        .profile-card { background-color: #202F36; padding: 30px 20px; border-radius: 20px; border: 2px solid #3C4B53; text-align: center; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background-color: #CE82FF; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; font-size: 50px; }
        .profile-name { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        
        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #202F36; padding: 15px; border-radius: 15px;
            margin-bottom: 15px; border: 2px solid #3C4B53;
        }
        .add-btn {
            background-color: #1CB0F6; color: white; border: none; border-bottom: 4px solid #1899D6;
            padding: 8px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px;
        }
        .add-btn.added { background-color: #52656D; border-bottom: 4px solid #3C4B53; color: #AFAFAF; }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; background-color: #131F24;
            border-top: 2px solid #202F36; display: flex; justify-content: space-around;
            padding: 15px 0; z-index: 100;
        }
        .nav-item { color: #52656D; font-size: 26px; padding: 5px 15px; border-radius: 10px; cursor: pointer; }
        .nav-item.active { color: #1CB0F6; background-color: rgba(28, 176, 246, 0.15); border: 2px solid #1CB0F6; }

        /* Quiz Modal */
        #quiz-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 300; padding: 20px; flex-direction: column;
        }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .close-btn { background: none; border: none; color: #52656D; font-size: 24px; cursor: pointer; }
        .quiz-question { font-size: 22px; font-weight: 800; margin-bottom: 30px; }
        .quiz-options { display: flex; flex-direction: column; gap: 15px; }
        .option-btn {
            background-color: #131F24; border: 2px solid #3C4B53; border-bottom: 4px solid #3C4B53;
            color: white; padding: 15px; border-radius: 15px; font-size: 18px; font-weight: 700;
            text-align: left; cursor: pointer;
        }
        .option-btn.correct { background-color: rgba(88, 204, 2, 0.2); border-color: #58CC02; color: #58CC02; }
        .option-btn.wrong { background-color: rgba(255, 75, 75, 0.2); border-color: #FF4B4B; color: #FF4B4B; }
    </style>
</head>
<body>

    <!-- 1. STARTBILDSCHIRM (Nur Name) -->
    <div id="onboarding">
        <h1>Willkommen bei CodeLingo!</h1>
        <p>Wie sollen wir dich nennen?</p>
        <input type="text" id="username-input" placeholder="Dein Name..." maxlength="15">
        <button class="start-btn" onclick="saveName()">Weiter</button>
    </div>

    <!-- 2. SPRACHAUSWAHL MODAL -->
    <div id="lang-modal">
        <div class="lang-header">
            <div class="lang-title">Kurse</div>
            <button class="close-btn" onclick="closeLangModal()">✖</button>
        </div>
        
        <div class="lang-section">
            <h3>Menschliche Sprachen</h3>
            <div id="human-langs"></div>
        </div>

        <div class="lang-section">
            <h3>Programmiersprachen</h3>
            <div id="code-langs"></div>
        </div>
    </div>

    <!-- 3. HAUPT-APP -->
    <div class="app-container" id="main-app">
        
        <div class="top-bar">
            <button class="course-switcher-btn" onclick="openLangModal()">
                <span id="current-flag">🇪🇸</span>
                <span style="font-size: 14px; font-weight: bold;">Wechseln</span>
            </button>
            <div class="stat streak">🔥 <span id="streak-val">17</span></div>
            <div class="stat gems">💎 <span id="gems-val">717</span></div>
            <div class="stat hearts">❤️ 5</div>
        </div>

        <div class="content-area">
            <!-- PFAD ANSICHT -->
            <div class="view active" id="view-path">
                <div class="path-container" id="path-container">
                    <!-- Wird per JS generiert -->
                </div>
            </div>

            <!-- FREUNDE ANSICHT -->
            <div class="view page-padding" id="view-friends">
                <h2 style="margin-bottom: 20px;">Community</h2>
                <div id="friends-list"></div>
            </div>

            <!-- PROFIL ANSICHT -->
            <div class="view page-padding" id="view-profile">
                <div class="profile-card">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-name" id="profile-name-display">Lernender</div>
                    <div style="display: flex; justify-content: space-around; width: 100%; margin-top: 15px;">
                        <div><span style="color:#FF9600; font-size:20px; font-weight:900;">17</span><br><span style="font-size:12px; color:#AFAFAF;">Streak</span></div>
                        <div><span style="color:#FF9600; font-size:20px; font-weight:900;" id="profile-friends-count">0</span><br><span style="font-size:12px; color:#AFAFAF;">Freunde</span></div>
                    </div>
                </div>
                <button class="start-btn" style="background-color: #FF4B4B; border-bottom-color: #CC0000; margin-top: 20px;" onclick="resetApp()">Account zurücksetzen</button>
            </div>
        </div>

        <!-- UNTERE NAVIGATION -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="changeView('path', 'nav-home')">🏠</div>
            <div class="nav-item" id="nav-friends" onclick="changeView('friends', 'nav-friends')">👥</div>
            <div class="nav-item" id="nav-league" onclick="alert('Liga kommt bald!')">🛡️</div>
            <div class="nav-item" id="nav-profile" onclick="changeView('profile', 'nav-profile')">👤</div>
        </div>

        <!-- QUIZ MODAL -->
        <div id="quiz-modal">
            <div class="quiz-header">
                <button class="close-btn" onclick="closeQuiz()">✖</button>
                <div style="color: #FF4B4B; font-weight: 900; font-size: 20px;">❤️ ❤️ ❤️ ❤️ ❤️</div>
                <div style="width: 24px;"></div>
            </div>
            <div class="quiz-question" id="quiz-question-text">Frage lädt...</div>
            <div class="quiz-options" id="quiz-options-container"></div>
        </div>
    </div>

    <script>
        // --- DATENSTRUKTUR FÜR ALLE SPRACHEN ---
        const allCourses = {
            // Menschliche Sprachen
            'spanisch': { name: 'Spanisch', flag: '🇪🇸', type: 'human', questions: [{ q: 'Wie sagt man "Hallo"?', a: ['Hola', 'Ciao'], correct: 0 }] },
            'englisch': { name: 'Englisch', flag: '🇬🇧', type: 'human', questions: [{ q: 'Wie sagt man "Hallo"?', a: ['Hello', 'Hola'], correct: 0 }] },
            'franzoesisch': { name: 'Französisch', flag: '🇫🇷', type: 'human', questions: [{ q: 'Wie sagt man "Hallo"?', a: ['Bonjour', 'Hola'], correct: 0 }] },
            'italienisch': { name: 'Italienisch', flag: '🇮🇹', type: 'human', questions: [{ q: 'Wie sagt man "Hallo"?', a: ['Ciao', 'Hello'], correct: 0 }] },
            
            // Programmiersprachen
            'lua': { name: 'Lua', flag: '🌙', type: 'code', questions: [{ q: 'Wie gibt man Text aus?', a: ['print()', 'echo'], correct: 0 }] },
            'python': { name: 'Python', flag: '🐍', type: 'code', questions: [{ q: 'Wie gibt man Text aus?', a: ['print()', 'console.log()'], correct: 0 }] },
            'javascript': { name: 'JavaScript', flag: '🟨', type: 'code', questions: [{ q: 'Wie gibt man Text aus?', a: ['console.log()', 'print()'], correct: 0 }] },
            'csharp': { name: 'C#', flag: '🎯', type: 'code', questions: [{ q: 'Wie gibt man Text aus?', a: ['Console.WriteLine()', 'print()'], correct: 0 }] }
        };

        const communityUsers = [
            { id: 1, name: 'MaxMustermann', xp: 1250, avatar: '🦊' },
            { id: 2, name: 'LernLise', xp: 840, avatar: '🐼' },
            { id: 3, name: 'CodeCrafter', xp: 2300, avatar: '🦉' }
        ];

        // --- STATUS ---
        let activeCourse = localStorage.getItem('activeCourse') || 'spanisch';
        let userName = localStorage.getItem('lingoName') || 'Lernender';
        let progress = JSON.parse(localStorage.getItem('lingoProgress')) || {};

        // --- INITIALISIERUNG ---
        window.onload = function() {
            // Wenn kein Name gesetzt ist, Onboarding zeigen
            if (!localStorage.getItem('lingoName')) {
                document.getElementById('onboarding').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            } else {
                enterApp();
            }
            buildLangMenu();
        }

        function saveName() {
            const nameInput = document.getElementById('username-input').value.trim();
            if (nameInput === '') { alert('Bitte gib einen Namen ein!'); return; }
            userName = nameInput;
            localStorage.setItem('lingoName', userName);
            enterApp();
        }

        function enterApp() {
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('profile-name-display').innerText = userName;
            renderPath();
            renderFriends();
        }

        function resetApp() {
            if(confirm("Wirklich alles löschen?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- SPRACHAUSWAHL LOGIK ---
        function buildLangMenu() {
            const humanContainer = document.getElementById('human-langs');
            const codeContainer = document.getElementById('code-langs');
            humanContainer.innerHTML = '';
            codeContainer.innerHTML = '';

            for (const [key, data] of Object.entries(allCourses)) {
                const item = `
                    <div class="course-item ${activeCourse === key ? 'selected' : ''}" onclick="switchCourse('${key}')">
                        <div class="course-info">
                            <div class="course-icon">${data.flag}</div>
                            <div>
                                <div class="course-name">${data.name}</div>
                                <div class="course-type">${data.type === 'human' ? 'Sprache' : 'Programmierung'}</div>
                            </div>
                        </div>
                        ${activeCourse === key ? '<span style="color:#1CB0F6; font-weight:900;">Aktiv</span>' : ''}
                    </div>
                `;
                if (data.type === 'human') humanContainer.innerHTML += item;
                else codeContainer.innerHTML += item;
            }
        }

        function openLangModal() {
            document.getElementById('lang-modal').style.display = 'flex';
        }

        function closeLangModal() {
            document.getElementById('lang-modal').style.display = 'none';
        }

        function switchCourse(courseId) {
            activeCourse = courseId;
            localStorage.setItem('activeCourse', courseId);
            closeLangModal();
            buildLangMenu(); // Markierung im Menü updaten
            renderPath(); // Pfad neu zeichnen
            changeView('path', 'nav-home'); // Zurück zum Pfad springen
        }

        // --- PFAD RENDERN (Duolingo Style) ---
        function renderPath() {
            document.getElementById('current-flag').innerText = allCourses[activeCourse].flag;
            const container = document.getElementById('path-container');
            container.innerHTML = ''; 
            
            const currentProgress = progress[activeCourse] || 0;

            // Wir bauen 3 Stufen (Units)
            const units = [
                { id: 1, title: 'Stufe 1, Abschnitt 1', desc: 'Grundlagen', color: 'bg-green' },
                { id: 2, title: 'Stufe 1, Abschnitt 2', desc: 'Fortgeschritten', color: 'bg-purple' },
                { id: 3, title: 'Stufe 1, Abschnitt 3', desc: 'Meisterhaft', color: 'bg-blue' }
            ];

            let globalNodeIndex = 1;

            units.forEach(unit => {
                // Unit Header
                container.innerHTML += `
                    <div class="unit-header ${unit.color}">
                        <div>
                            <h2>${unit.title}</h2>
                            <p>${unit.desc}</p>
                        </div>
                        <div class="icon">📖</div>
                    </div>
                `;

                // 4 Lektionen pro Stufe
                for (let i = 1; i <= 4; i++) {
                    let isCompleted = globalNodeIndex <= currentProgress;
                    let isActive = globalNodeIndex === currentProgress + 1;
                    
                    let nodeClass = isActive ? 'active' : (isCompleted ? 'active' : 'locked');
                    let nodeIcon = isCompleted ? '⭐' : (isActive ? '📖' : '🔒');
                    let tooltipHTML = isActive ? `<div class="tooltip">HIERHIN SPRINGEN?</div>` : '';
                    let onClick = isActive ? `onclick="openQuiz(${globalNodeIndex})"` : '';

                    // Zufällige Hintergrund-Deko (Charaktere/Boxen) für den Duolingo-Look
                    let decoHTML = '';
                    if (i === 2 && unit.id === 1) decoHTML = `<div class="bg-deco" style="right: 20px; top: 10px; font-size: 50px;">📦</div>`;
                    if (i === 4 && unit.id === 2) decoHTML = `<div class="bg-deco" style="left: 20px; top: 10px; font-size: 60px;">🦉</div>`;

                    container.innerHTML += `
                        <div class="node-wrapper">
                            ${tooltipHTML}
                            ${decoHTML}
                            <button class="node ${nodeClass}" ${onClick}>
                                ${nodeIcon}
                            </button>
                        </div>
                    `;
                    globalNodeIndex++;
                }
            });

            // Ganz unten: "Anschließend Stufe 2" (Gesperrt)
            container.innerHTML += `
                <div style="text-align: center; margin-top: 40px; opacity: 0.3;">
                    <h2 style="font-size: 20px; font-weight: 900;">🔒 Stufe 2</h2>
                    <p style="font-size: 14px; margin-top: 5px;">Lerne Wörter, Ausdrücke und Grammatik</p>
                </div>
            `;
        }

        // --- NAVIGATION ---
        function changeView(viewName, navId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.add('active');
            document.getElementById(navId).classList.add('active');
        }

        // --- FREUNDE ---
        function renderFriends() {
            const list = document.getElementById('friends-list');
            list.innerHTML = '';
            let followedCount = 0;

            communityUsers.forEach(user => {
                let isFollowed = localStorage.getItem('followed_' + user.id) === 'true';
                if(isFollowed) followedCount++;

                list.innerHTML += `
                    <div class="user-card">
                        <div class="user-info" style="display:flex; align-items:center; gap:15px;">
                            <div style="width:50px; height:50px; background:#1CB0F6; border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:24px;">${user.avatar}</div>
                            <div>
                                <div style="font-weight:800; font-size:16px;">${user.name}</div>
                                <div style="color:#FF9600; font-size:12px; font-weight:700;">💎 ${user.xp} XP</div>
                            </div>
                        </div>
                        <button class="add-btn ${isFollowed ? 'added' : ''}" onclick="toggleFollow(${user.id})">
                            ${isFollowed ? 'Gefolgt' : 'Folgen'}
                        </button>
                    </div>
                `;
            });
            document.getElementById('profile-friends-count').innerText = followedCount;
        }

        function toggleFollow(userId) {
            let isFollowed = localStorage.getItem('followed_' + userId) === 'true';
            localStorage.setItem('followed_' + userId, isFollowed ? 'false' : 'true');
            renderFriends();
        }

        // --- QUIZ LOGIK ---
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let currentTargetNode = 0;

        function openQuiz(nodeIndex) {
            currentTargetNode = nodeIndex;
            currentQuestions = allCourses[activeCourse].questions;
            currentQuestionIndex = 0;
            document.getElementById('quiz-modal').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                completeLesson();
                return;
            }
            let qData = currentQuestions[currentQuestionIndex];
            document.getElementById('quiz-question-text').innerText = qData.q;
            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            qData.a.forEach((optionText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, index === qData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 800);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => {
                    allBtns.forEach(b => { b.classList.remove('wrong'); b.disabled = false; });
                }, 800);
            }
        }

        function completeLesson() {
            closeQuiz();
            progress[activeCourse] = currentTargetNode;
            localStorage.setItem('lingoProgress', JSON.stringify(progress));
            renderPath();
            
            // Kleiner Scroll-Effekt zum neuen Level
            setTimeout(() => {
                const activeNode = document.querySelector('.tooltip');
                if(activeNode) activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
        }
    </script>
</body>
</html>
