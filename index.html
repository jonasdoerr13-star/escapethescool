<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regenpause – Das Geheimnis der Schule</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #crosshair {
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:rgba(255,255,255,0.55);
    box-shadow:0 0 4px rgba(0,0,0,0.8);
  }

  #prompt {
    position:absolute; left:50%; top:56%; transform:translateX(-50%);
    color:#ffe9a8; font-size:17px; letter-spacing:0.5px; text-shadow:0 2px 6px #000;
    background:rgba(0,0,0,0.45); padding:6px 14px; border-radius:6px;
    border:1px solid rgba(255,220,120,0.35);
    opacity:0; transition:opacity .15s;
  }

  #subtitle {
    position:absolute; left:50%; bottom:70px; transform:translateX(-50%);
    width:min(900px, 88vw); text-align:center;
    color:#f2f2f2; font-size:19px; line-height:1.45;
    text-shadow:0 2px 8px #000, 0 0 20px #000;
    background:rgba(0,0,0,0.5); padding:10px 18px; border-radius:8px;
    opacity:0; transition:opacity .4s;
  }

  #objective {
    position:absolute; left:22px; top:20px;
    color:#cfe6ff; font-size:15px; line-height:1.5;
    text-shadow:0 2px 6px #000;
    background:rgba(0,0,0,0.4); padding:8px 12px; border-radius:6px;
    border-left:3px solid #4a8fd4;
    max-width:320px;
  }

  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:9;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%);
  }

  #fade {
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    transition:opacity 1.2s ease; z-index:50;
  }

  #overlay {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #10131c 0%, #000 75%);
    color:#e8e8e8; text-align:center; padding:30px;
    cursor:pointer;
  }
  #overlay h1 {
    font-size:clamp(30px, 6vw, 64px); letter-spacing:8px; font-weight:800;
    color:#dfe7f5; text-shadow:0 0 30px rgba(90,140,255,0.5);
    margin-bottom:8px;
  }
  #overlay h2 {
    font-size:clamp(13px, 2vw, 18px); letter-spacing:4px; font-weight:400;
    color:#7f8ea8; margin-bottom:38px; text-transform:uppercase;
  }
  #overlay p { font-size:16px; color:#9aa8bd; max-width:620px; line-height:1.7; }
  #overlay .key { color:#ffe9a8; font-weight:700; }
  #overlay .start {
    margin-top:34px; font-size:18px; color:#ffe9a8; letter-spacing:2px;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  #endOverlay {
    position:fixed; inset:0; z-index:100; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; color:#cfd8e6; text-align:center; padding:40px;
  }
  #endOverlay h1 { font-size:clamp(26px,5vw,52px); letter-spacing:6px; color:#b9c7dc; margin-bottom:24px; }
  #endOverlay p { font-size:18px; line-height:1.9; color:#8fa0b8; max-width:700px; }
  #endOverlay .name { color:#ffcf6b; }
  #endOverlay button {
    margin-top:36px; padding:12px 30px; font-size:16px; letter-spacing:2px;
    background:transparent; color:#ffe9a8; border:1px solid #ffe9a8;
    border-radius:4px; cursor:pointer; transition:.2s;
  }
  #endOverlay button:hover { background:#ffe9a8; color:#000; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="subtitle"></div>
  <div id="objective"></div>
</div>
<div id="vignette"></div>
<div id="fade"></div>

<div id="overlay">
  <h1>REGENPAUSE</h1>
  <h2>Das Geheimnis der Schule</h2>
  <p>
    Du sitzt im Unterricht. Draußen regnet es in Strömen.<br>
    Dann kommt die Durchsage – und irgendetwas stimmt nicht mit dieser Schule.
  </p>
  <p style="margin-top:22px">
    <span class="key">WASD</span> laufen &nbsp;·&nbsp;
    <span class="key">Maus</span> umsehen &nbsp;·&nbsp;
    <span class="key">E</span> interagieren &nbsp;·&nbsp;
    <span class="key">Shift</span> rennen
  </p>
  <div class="start">KLICKEN ZUM STARTEN</div>
</div>

<div id="endOverlay">
  <h1 id="endTitle">ENDE</h1>
  <p id="endText"></p>
  <button onclick="location.reload()">NOCHMAL SPIELEN</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   GRUNDGERÜST
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x05060a, 0.014);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   AUDIO
   ============================================================ */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return actx;
}
function beep(freq, dur, vol = 0.08, type = 'sine') {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(a.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.stop(a.currentTime + dur + 0.02);
}
function stepSound() { beep(90 + Math.random() * 25, 0.09, 0.05, 'triangle'); }
function pickupSound() { beep(880, 0.08, 0.07); setTimeout(() => beep(1320, 0.14, 0.06), 70); }
function doorSound() { beep(140, 0.35, 0.06, 'sawtooth'); }

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
const colliders = [];

const wallMat  = new THREE.MeshLambertMaterial({ color: 0xcdc5b2 });
const floorMat = new THREE.MeshLambertMaterial({ color: 0x6b6152 });
const ceilMat  = new THREE.MeshLambertMaterial({ color: 0x8d8678 });
const doorMat  = new THREE.MeshLambertMaterial({ color: 0x6b4a2a });
const metalMat = new THREE.MeshLambertMaterial({ color: 0x6d7480 });

function makeWall(x, z, w, d, h = 3.4, y = 0, mat = wallMat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  scene.add(m);
  colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}
function hwall(z, x1, x2, mat) { if (Math.abs(x2 - x1) < 0.01) return; return makeWall((x1 + x2) / 2, z, Math.abs(x2 - x1), 0.3, 3.4, 0, mat); }
function vwall(x, z1, z2, mat) { if (Math.abs(z2 - z1) < 0.01) return; return makeWall(x, (z1 + z2) / 2, 0.3, Math.abs(z2 - z1), 3.4, 0, mat); }

function box(x, y, z, w, h, d, color, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

function makePerson(color, skin = 0xe8b48a) {
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 0.75, 8), new THREE.MeshLambertMaterial({ color }));
  torso.position.y = 0.88;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 12), new THREE.MeshLambertMaterial({ color: skin }));
  head.position.y = 1.4;
  const legs = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.55, 0.26), new THREE.MeshLambertMaterial({ color: 0x22252c }));
  legs.position.y = 0.27;
  g.add(torso, head, legs);
  return g;
}

function makeKey() {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xd9b23c });
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.15), mat);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.011, 6, 14), mat);
  ring.position.z = 0.09;
  const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.03), mat);
  tooth.position.set(0.03, 0, -0.06);
  g.add(shaft, ring, tooth);
  return g;
}

/* Fototapeten für den Keller */
function photoTexture(kind) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = '#141210'; g.fillRect(0, 0, 256, 192);
  const grd = g.createRadialGradient(128, 96, 15, 128, 96, 155);
  grd.addColorStop(0, 'rgba(120,90,75,0.55)');
  grd.addColorStop(1, 'rgba(0,0,0,0.95)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 192);
  g.fillStyle = '#060606';
  if (kind === 0) {
    g.beginPath(); g.arc(128, 62, 16, 0, 7); g.fill();
    g.fillRect(112, 78, 32, 62);
    g.fillRect(98, 140, 60, 9);
    g.fillRect(102, 149, 8, 34);
    g.fillRect(146, 149, 8, 34);
  } else if (kind === 1) {
    for (let r = 0; r < 3; r++) for (let i = 0; i < 5; i++) {
      const x = 32 + i * 46, y = 58 + r * 42;
      g.beginPath(); g.arc(x, y, 8, 0, 7); g.fill();
      g.fillRect(x - 9, y + 9, 18, 24);
    }
  } else {
    g.fillStyle = '#c8b070';
    g.beginPath(); g.arc(128, 38, 13, 0, 7); g.fill();
    g.fillStyle = '#060606';
    g.fillRect(58, 98, 140, 74);
    g.beginPath(); g.arc(128, 150, 22, 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(200,180,160,0.13)';
  for (let i = 0; i < 22; i++) {
    g.beginPath();
    g.moveTo(Math.random() * 256, Math.random() * 192);
    g.lineTo(Math.random() * 256, Math.random() * 192);
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}

/* ============================================================
   LICHT
   ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281e, 0.45));

function pointLight(x, y, z, color = 0xfff0d0, intensity = 1.0, dist = 22) {
  const l = new THREE.PointLight(color, intensity, dist, 2);
  l.position.set(x, y, z);
  scene.add(l);
  return l;
}
pointLight(-20, 3.1, 0, 0xfff2d8, 1.1);
pointLight(0, 3.1, 0, 0xfff2d8, 1.1);
pointLight(20, 3.1, 0, 0xfff2d8, 1.1);
pointLight(-24, 3.1, 10, 0xffeccc, 0.9);
pointLight(-4, 3.1, 10, 0xffeccc, 0.9);
pointLight(-5, 3.1, -10, 0xffeccc, 0.9);
pointLight(205, 3.0, 0, 0xff8866, 0.7, 30);

/* ============================================================
   SCHULE BAUEN
   ============================================================ */
const floor = new THREE.Mesh(new THREE.BoxGeometry(90, 0.2, 60), floorMat);
floor.position.set(0, -0.1, 0);
scene.add(floor);

const ceil = new THREE.Mesh(new THREE.BoxGeometry(90, 0.2, 60), ceilMat);
ceil.position.set(0, 3.5, 0);
scene.add(ceil);

/* --- Korridor --- */
hwall(-4, -32, -6);          // Nordwand (Lücke: Lehrerzimmer)
hwall(-4, -4, 32);
hwall(4, -32, -30);          // Südwand (Lücke: Klassenzimmer)
hwall(4, -28, -6);           // (Lücke: Raum B)
hwall(4, -4, 32);
vwall(-32, -4, 4);
vwall(32, -4, 4);

/* --- Klassenzimmer --- */
vwall(-32, 4, 16);
vwall(-16, 4, 16);
hwall(16, -32, -16);

/* --- Raum B (mit Schrank) --- */
vwall(-10, 4, 16);
vwall(2, 4, 16);
hwall(16, -10, 2);

/* --- Lehrerzimmer --- */
vwall(-10, -16, -4);
vwall(0, -16, -4);
hwall(-16, -10, 0);

/* --- Türrahmen-Deko --- */
function doorFrame(x, z, rotY = 0, w = 2) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  box(-w / 2 - 0.1, 1.1, 0, 0.2, 2.2, 0.35, 0x8a7f6a, g);
  box(w / 2 + 0.1, 1.1, 0, 0.2, 2.2, 0.35, 0x8a7f6a, g);
  box(0, 2.25, 0, w + 0.4, 0.2, 0.35, 0x8a7f6a, g);
  scene.add(g);
  return g;
}
doorFrame(-29, 4);
doorFrame(-5, 4);
doorFrame(-5, -4);

/* Offene Tür zum Lehrerzimmer */
const openDoor = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.1, 1.0), doorMat);
openDoor.position.set(-4.4, 1.05, -4.55);
scene.add(openDoor);
box(-4.4, 2.5, -4.5, 1.4, 0.45, 0.1, 0x2e6b3a); // Schild

/* --- Keller-Tür (im Korridor, Nordwand) --- */
const kellerDoor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.2, 0.12), doorMat);
kellerDoor.position.set(20, 1.1, -3.82);
scene.add(kellerDoor);
const kellerSign = box(20, 2.5, -3.7, 1.7, 0.45, 0.08, 0x5a3a1a);
box(20, 2.5, -3.65, 1.5, 0.28, 0.02, 0xcfc0a0);

/* --- Ausgangstür (Korridor Südwand) --- */
const exitDoor = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.3, 0.12), new THREE.MeshLambertMaterial({ color: 0x3f5a3f }));
exitDoor.position.set(29, 1.15, 3.82);
scene.add(exitDoor);
box(29, 2.62, 3.7, 2.0, 0.4, 0.08, 0x1e3a1e);

/* ============================================================
   KLASSENZIMMER EINRICHTEN
   ============================================================ */
function makeDesk(x, z) {
  box(x, 0.72, z, 1.25, 0.08, 0.72, 0x9a7b52);
  box(x - 0.55, 0.36, z, 0.07, 0.72, 0.68, 0x7d6242);
  box(x + 0.55, 0.36, z, 0.07, 0.72, 0.68, 0x7d6242);
  box(x, 0.45, z + 0.36, 1.1, 0.05, 0.05, 0x7d6242);
}

const deskCols = [-28, -25, -22, -19];
const deskRows = [8, 11, 14];
for (const cx of deskCols) for (const rz of deskRows) makeDesk(cx, rz);

/* Mitschüler */
const shirtColors = [0x3b5a8c, 0x8c3b4a, 0x4a7c4a, 0x7a6a3a, 0x5a4a7c, 0x3a6a6a];
let ci = 0;
for (const cx of deskCols) for (const rz of deskRows) {
  if (Math.abs(cx + 22) < 0.1 && Math.abs(rz - 11) < 0.1) continue; // Platz des Spielers
  const p = makePerson(shirtColors[ci++ % shirtColors.length]);
  p.position.set(cx, -0.32, rz + 0.1);
  p.rotation.y = 0;
  scene.add(p);
}

/* Tafel */
box(-22, 2.0, 4.28, 6.2, 1.7, 0.1, 0x1e3a2a);
box(-22, 2.0, 4.33, 5.8, 1.4, 0.02, 0x24463a);
box(-22, 0.95, 4.4, 6.4, 0.12, 0.3, 0x7d6242);

/* Lehrer */
const teacherIntro = makePerson(0x2f3542, 0xe0b090);
teacherIntro.position.set(-22, 0, 6);
teacherIntro.rotation.y = Math.PI;
scene.add(teacherIntro);

/* ============================================================
   RAUM B – SPINDANLAGE
   ============================================================ */
for (let i = 0; i < 6; i++) {
  const z = 6.5 + i * 1.6;
  box(-9.55, 1.0, z, 0.5, 2.0, 0.95, 0x4a5560);
  box(-9.28, 1.0, z, 0.03, 1.85, 0.88, 0x39424c);
}

/* Spezial-Spind (verschlossen) */
const lockerGroup = new THREE.Group();
lockerGroup.position.set(-9.3, 0, 10.7);
scene.add(lockerGroup);

const lockerBox = box(-0.25, 1.05, 0, 0.5, 2.1, 1.0, 0x3f4a56, lockerGroup);
box(-0.5, 2.15, 0, 0.6, 0.12, 1.1, 0x2b333c, lockerGroup);

const lockerPivot = new THREE.Group();
lockerPivot.position.set(0, 1.05, -0.5);
lockerGroup.add(lockerPivot);
const lockerDoor = box(0.0, 0, 0.5, 0.05, 2.0, 0.98, 0x556170, lockerPivot);
const lock = box(0.04, 0.0, 0.9, 0.06, 0.14, 0.1, 0xd9b23c, lockerPivot);

/* Inhalt des Spinds */
const noteMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(0.35, 0.48),
  new THREE.MeshLambertMaterial({ color: 0xf5f0dc, side: THREE.DoubleSide })
);
noteMesh.position.set(-0.05, 1.15, 10.5);
noteMesh.rotation.y = Math.PI / 2;
noteMesh.visible = false;
scene.add(noteMesh);

const kellerKeyMesh = makeKey();
kellerKeyMesh.position.set(-0.2, 0.85, 10.5);
kellerKeyMesh.rotation.y = Math.PI / 2;
kellerKeyMesh.visible = false;
scene.add(kellerKeyMesh);

/* ============================================================
   LEHRERZIMMER
   ============================================================ */
box(-5, 0.76, -10, 3.2, 0.1, 1.3, 0x8a6a44);
box(-5, 0.38, -10, 0.15, 0.76, 0.15, 0x6a4f33);
box(-6.4, 0.5, -9.2, 0.5, 0.06, 0.5, 0x333a44);
box(-3.6, 0.5, -10.8, 0.5, 0.06, 0.5, 0x333a44);

/* Schrank zum Verstecken (offene Front) */
const cabinet = new THREE.Group();
cabinet.position.set(-8.5, 0, -15.4);
scene.add(cabinet);
const cabMat = new THREE.MeshLambertMaterial({ color: 0x5a4432 });
box(-0.6, 1.1, 0, 0.08, 2.2, 0.62, cabMat, cabinet);   // Rückwand
box(-0.30, 1.1, -0.28, 0.6, 2.2, 0.06, cabMat, cabinet); // Seite
box(-0.30, 1.1, 0.28, 0.6, 2.2, 0.06, cabMat, cabinet);  // Seite
box(-0.30, 2.17, 0, 0.62, 0.07, 0.6, cabMat, cabinet);   // Deckel
box(-0.30, 0.05, 0, 0.62, 0.1, 0.6, cabMat, cabinet);    // Boden

/* Schlüssel auf dem Tisch (nach Versteck-Szene) */
const tableKey = makeKey();
tableKey.position.set(-5, 0.86, -10);
tableKey.visible = false;
scene.add(tableKey);

/* Lehrer-NPC (schläft später am Tisch) */
const sleepingTeacher = makePerson(0x2f3542, 0xe0b090);
sleepingTeacher.position.set(-5, -0.35, -9.0);
sleepingTeacher.rotation.y = 0;
sleepingTeacher.visible = false;
scene.add(sleepingTeacher);

/* Zwei Lehrer für die Versteck-Szene */
const npcA = makePerson(0x2b2b3a, 0xdeb090);
const npcB = makePerson(0x3a2b2b, 0xd8a888);
npcA.position.set(-6.5, 0, -7.5); npcA.rotation.y = Math.PI;
npcB.position.set(-3.0, 0, -7.5); npcB.rotation.y = Math.PI;
npcA.visible = false; npcB.visible = false;
scene.add(npcA, npcB);

/* ============================================================
   KELLER (weit weg platziert)
   ============================================================ */
const CEL = { cx: 205, cz: 0 };
vwall(CEL.cx - 10, -8, 8, new THREE.MeshLambertMaterial({ color: 0x4a443c }));
vwall(CEL.cx + 10, -8, 8, new THREE.MeshLambertMaterial({ color: 0x4a443c }));
hwall(-8, CEL.cx - 10, CEL.cx + 10, new THREE.MeshLambertMaterial({ color: 0x4a443c }));
hwall(8, CEL.cx - 10, CEL.cx + 10, new THREE.MeshLambertMaterial({ color: 0x4a443c }));
const celFloor = new THREE.Mesh(new THREE.BoxGeometry(21, 0.2, 17), new THREE.MeshLambertMaterial({ color: 0x2e2a26 }));
celFloor.position.set(CEL.cx, -0.1, 0);
scene.add(celFloor);
const celCeil = new THREE.Mesh(new THREE.BoxGeometry(21, 0.2, 17), new THREE.MeshLambertMaterial({ color: 0x1e1c1a }));
celCeil.position.set(CEL.cx, 3.5, 0);
scene.add(celCeil);

/* Fotos an den Wänden */
const photoMeshes = [];
const photoKinds = [0, 1, 2];
const photoPositions = [
  [CEL.cx - 6, 1.8, -7.8, 0],
  [CEL.cx + 0, 1.8, -7.8, 0],
  [CEL.cx + 6, 1.8, -7.8, 0],
  [CEL.cx - 9.8, 1.8, -2, Math.PI / 2],
  [CEL.cx - 9.8, 1.8, 3, Math.PI / 2]
];
photoPositions.forEach((p, i) => {
  const tex = photoTexture(photoKinds[i % 3]);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.5), new THREE.MeshLambertMaterial({ map: tex }));
  m.position.set(p[0], p[1], p[2]);
  m.rotation.y = p[3];
  scene.add(m);
  photoMeshes.push(m);
});

/* Rücktür im Keller */
const cellarBackDoor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.2, 0.12), doorMat);
cellarBackDoor.position.set(CEL.cx, 1.1, 7.8);
scene.add(cellarBackDoor);

function makeJet() {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0x6d7883 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2a2f36 });
  const glass = new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.55 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.65, 8, 10), mat);
  body.rotation.x = Math.PI / 2;
  g.add(body);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.9, 3.2, 10), mat);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -5.6;
  g.add(nose);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.22, 2.6), mat);
  wing.position.set(0, -0.25, 0.6);
  g.add(wing);

  const wingL = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.18, 1.6), dark);
  wingL.position.set(-4.2, -0.25, 1.6);
  g.add(wingL);
  const wingR = wingL.clone(); wingR.position.x = 4.2; g.add(wingR);

  const tail = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 1.4), mat);
  tail.position.set(0, 0.55, 3.9);
  g.add(tail);

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.7, 1.5), mat);
  fin.position.set(0, 1.3, 3.9);
  g.add(fin);

  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), glass);
  cockpit.position.set(0, 0.55, -2.6);
  cockpit.scale.set(1, 0.75, 1.9);
  g.add(cockpit);

  return g;
}

  walk: 4.2,
  run: 7.0,

};
let yaw = 0, pitch = 0;
let canMove = false;
let locked = false;
const keys = {};

const overlay = document.getElementById('overlay');
const promptEl = document.getElementById('prompt');
const subtitleEl = document.getElementById('subtitle');
const objectiveEl = document.getElementById('objective');
const fadeEl = document.getElementById('fade');

overlay.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
  audio();
});
renderer.domElement.addEventListener('click', () => {
  if (!locked) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) overlay.style.display = 'none';
});
document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
});
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

/* Untertitel */
let subTimer = null;
function say(text, dur = 4.2) {
  subtitleEl.textContent = text;
  subtitleEl.style.opacity = 1;
  clearTimeout(subTimer);

function setObjective(text) {

/* ============================================================
   INTERAKTIONEN
   ============================================================ */
const interactables = [];
function addInteractable(x, y, z, label, action, radius = 2.2) {
  const it = { pos: new THREE.Vector3(x, y, z), label, action, radius, enabled: false };
  interactables.push(it);
  return it;
}
let nearest = null;

function tryInteract() {
  if (!canMove || !nearest) return;
  nearest.action();
}

function updateInteractPrompt() {
  let best = null, bestD = Infinity;
  for (const it of interactables) {
    if (!it.enabled) continue;
    const d = it.pos.distanceTo(player.pos);
    if (d < it.radius && d < bestD) { bestD = d; best = it; }
  }
  nearest = best;
  if (best) {
    promptEl.textContent = best.label;
    promptEl.style.opacity = 1;
  } else {
    promptEl.style.opacity = 0;
  }
}

/* ============================================================
   KOLLISION
   ============================================================ */
function blocked(x, z) {
  const r = player.radius;
  for (const c of colliders) {
    if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return true;
  }
  return false;
}

/* ============================================================
   BEWEGUNG
   ============================================================ */
function handleMovement(dt) {
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

  let move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);

  if (move.lengthSq() > 0) {
    move.normalize();
    const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? player.run : player.walk;
    const dx = move.x * speed * dt;
    const dz = move.z * speed * dt;

    const nx = player.pos.x + dx;
    if (!blocked(nx, player.pos.z)) player.pos.x = nx;

    const nz = player.pos.z + dz;
    if (!blocked(player.pos.x, nz)) player.pos.z = nz;

    // Schritte
    stepAcc += dt * speed;
    if (stepAcc > 2.6) { stepAcc = 0; stepSound(); }
  }
}
let stepAcc = 0;

/* ============================================================
   KAMERA
   ============================================================ */
function updateCamera() {
  camera.position.set(player.pos.x, player.eye, player.pos.z);
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  camera.rotation.z = 0;
}

/* ============================================================
   STORY-UPDATE
   ============================================================ */
function updateStory(dt) {
  switch (state) {

    case 'intro': {
      while (introIndex < introLines.length && timer >= introLines[introIndex][0]) {
        const line = introLines[introIndex];
        say(line[1], line[2]);
        if (introIndex === 3) beep(1400, 0.4, 0.05);
        if (introIndex === 4) beep(1400, 0.4, 0.05);
        introIndex++;
      }
      if (timer > 27) {
        player.eye = 1.62;
        canMove = true;
        setState('free');
        say('Regenpause. Du hast Zeit – und die Schule ist groß.', 5);
      }
      break;
    }

    case 'free': {
      // Betreten des Lehrerzimmers
      const p = player.pos;
      if (p.x > -10 && p.x < 0 && p.z > -16 && p.z < -4) {
        setState('enterLehrerzimmer');
        say('Ein Raum, den du noch nie gesehen hast. Die Tür stand offen ...', 4);
      }
      break;
    }

    case 'enterLehrerzimmer': {
      if (timer > 3.0 && timer < 3.2) {
        beep(110, 0.15, 0.09, 'triangle');
        say('Schritte auf dem Gang! Sie kommen näher ...', 4);
        itCabinet.enabled = true;
        setObjective('VERSTECK DICH! Geh zum Schrank und drücke E.');
      }
      if (timer > 4.0 && timer < 4.2) beep(110, 0.15, 0.09, 'triangle');
      if (timer > 5.0 && timer < 5.2) beep(110, 0.15, 0.09, 'triangle');

      if (timer > 12) {
        // Nicht versteckt -> erwischt
        caught();
      }
      break;
    }

    case 'hiding': {
      if (timer > 0.5 && timer < 0.7) {
        doorSound();
        npcA.visible = true; npcB.visible = true;
        say('Die Tür geht auf. Zwei Lehrer kommen herein.', 3.5);
      }
      if (timer > 3.5 && timer < 3.7) say('Lehrer A: „... und der Neue? Hat er die Fotos gesehen?"', 4.5);
      if (timer > 8.0 && timer < 8.2) say('Lehrer B: „Nein. Der Keller ist abgeschlossen. Hier, der Schlüssel."', 4.5);
      if (timer > 12.5 && timer < 12.7) say('Lehrer A: „Leg ihn auf den Tisch. Wir müssen los."', 4);
      if (timer > 15.5 && timer < 15.7) {
        npcA.visible = false; npcB.visible = false;
        doorSound();
        tableKey.visible = true;
        itTableKey.enabled = true;
        say('Die Schritte entfernen sich. Sie sind weg.', 3.5);
      }
      if (timer > 17) {
        itCabinet.label = 'Schrank verlassen (E)';
        itCabinet.enabled = true;
        setObjective('Verlasse den Schrank (E) und nimm den Schlüssel.');
      }
      break;
    }

    case 'findLock': {
      // Betreten von Raum B triggert Hinweis
      const p = player.pos;
      if (!state._hint && p.x > -10 && p.x < 2 && p.z > 4 && p.z < 16) {
        state._hint = true;
        say('Eine Spindanlage. Einer davon hat ein Schloss ...', 4);
      }
      break;
    }

    case 'cellarIn': {
      if (timer > 4 && !state._hint2) {
        state._hint2 = true;
        say('An den Wänden hängen Fotos. Sieh sie dir an (E).', 5);
      }
      break;
    }

    case 'locked': {
      break;
    }

    case 'teacher': {
      if (player.pos.z < -4 && player.pos.x > -10 && player.pos.x < 0 && !itTeacherKey.enabled) {
        itTeacherKey.enabled = true;
      }
      break;
    }

    case 'chase': {
      if (chaseTeacher) {
        const dir = new THREE.Vector3(
          player.pos.x - chaseTeacher.position.x, 0,
          player.pos.z - chaseTeacher.position.z
        );
        const dist = dir.length();
        if (dist > 0.001) dir.normalize();

        const spd = 3.4;
        const nx = chaseTeacher.position.x + dir.x * spd * dt;
        const nz = chaseTeacher.position.z + dir.z * spd * dt;

        // einfache Kollision für den Lehrer
        let ok = true;
        const r = 0.4;
        for (const c of colliders) {
          if (nx > c.minX - r && nx < c.maxX + r && nz > c.minZ - r && nz < c.maxZ + r) { ok = false; break; }
        }
        if (ok) {
          chaseTeacher.position.x = nx;
          chaseTeacher.position.z = nz;
        } else {
          // an der Wand entlang rutschen
          let okX = true;
          for (const c of colliders) {
            if (nx > c.minX - r && nx < c.maxX + r && chaseTeacher.position.z > c.minZ - r && chaseTeacher.position.z < c.maxZ + r) { okX = false; break; }
          }
          if (okX) chaseTeacher.position.x = nx;
          let okZ = true;
          for (const c of colliders) {
            if (chaseTeacher.position.x > c.minX - r && chaseTeacher.position.x < c.maxX + r && nz > c.minZ - r && nz < c.maxZ + r) { okZ = false; break; }
          }
          if (okZ) chaseTeacher.position.z = nz;
        }

        chaseTeacher.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;

        if (dist < 1.3) {
          caught();
        }

        // Schritte-Sound
        chaseStep += dt * spd;
        if (chaseStep > 2.0) { chaseStep = 0; beep(85, 0.1, 0.06, 'triangle'); }
      }
      break;
    }

    case 'yard': {
      if (jet.position.y > 1.0) {
        jet.position.y = Math.max(1.0, jet.position.y - dt * 7);
      }
      break;
    }
  }
}
let chaseStep = 0;

function caught() {
  canMove = false;
  setState('caught');
  document.getElementById('endTitle').textContent = 'ERWISCHT';
  document.getElementById('endText').innerHTML =
    'Der Lehrer packt dich an der Schulter.<br>Was danach passiert, erzählt niemand.<br><br>' +
    '<span style="color:#5d6b80;font-size:15px">— GAME OVER —</span>';
  document.getElementById('endOverlay').style.display = 'flex';
}

/* ============================================================
   RENDER-LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  timer += dt;

  updateStory(dt);

  if (canMove && !hidden) handleMovement(dt);
  updateInteractPrompt();
  updateCamera();

  renderer.render(scene, camera);
}

/* Startzustand */
setObjective('');
camera.position.set(player.pos.x, player.eye, player.pos.z);
animate();
