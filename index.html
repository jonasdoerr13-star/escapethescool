<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duolingo Clone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #131F24; color: white; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        .app-container { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; position: relative; }

        /* Obere Leiste - Exakt wie auf Foto 2 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; font-size: 17px; font-weight: 900; z-index: 10; background-color: #131F24;
        }
        .stat { display: flex; align-items: center; gap: 4px; }
        .stat img { width: 24px; height: 24px; } /* Platzhalter für echte Icons */
        .stat.streak { color: #FF9600; }
        .stat.gems { color: #1CB0F6; }
        .stat.hearts { color: #FF4B4B; }

        /* Der scrollbare Bereich */
        .content-area { flex: 1; overflow-y: auto; padding: 0 0 100px 0; display: flex; flex-direction: column; position: relative; }

        /* Die Stufen-Header (z.B. das rote "Beschreibe Wetter mit hace") */
        .unit-header {
            width: 92%; margin: 10px auto 40px auto; padding: 15px 20px;
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
            color: #131F24; box-shadow: 0 4px 0 rgba(0,0,0,0.2); position: sticky; top: 10px; z-index: 5;
        }
        .unit-header h2 { font-size: 13px; font-weight: 900; text-transform: uppercase; opacity: 0.8; }
        .unit-header p { font-size: 17px; font-weight: 900; margin-top: 2px; }
        
        /* Farben aus deinen Fotos */
        .bg-green { background-color: #58CC02; color: white; }
        .bg-red { background-color: #FF4B4B; color: white; }
        .bg-purple { background-color: #CE82FF; color: white; }
        .bg-orange { background-color: #FF9600; color: white; }
        .bg-blue { background-color: #1CB0F6; color: white; }

        /* Der Pfad */
        .path-container { display: flex; flex-direction: column; position: relative; width: 100%; }

        /* Die grauen Verbindungslinien zwischen den Kreisen */
        .node-wrapper {
            position: relative; margin-bottom: 35px; display: flex; justify-content: center; width: 100%; z-index: 2;
        }
        .node-wrapper::before {
            content: ''; position: absolute; top: -35px; bottom: -35px; left: 50%; width: 14px;
            background-color: #2A353B; z-index: 1; transform: translateX(-50%);
        }
        .node-wrapper:first-of-type::before { display: none; } /* Über dem ersten Kreis keine Linie */

        /* Der geschwungene Pfad */
        .node-wrapper:nth-child(4n+2) { transform: translateX(45px); }
        .node-wrapper:nth-child(4n+3) { transform: translateX(-45px); }
        .node-wrapper:nth-child(4n+4) { transform: translateX(0px); }

        /* Die Kreise */
        .node {
            width: 72px; height: 72px; border-radius: 50%;
            border: none; display: flex; justify-content: center; align-items: center;
            font-size: 30px; cursor: pointer; transition: all 0.1s;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3); position: relative; z-index: 2;
        }
        .node:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        
        /* Der aktive Knoten (Grün, mit Stern) */
        .node.active { background-color: #58CC02; color: white; }
        /* Gesperrter Knoten (Grau) */
        .node.locked { background-color: #2A353B; color: #52656D; box-shadow: 0 8px 0 #131F24; cursor: not-allowed; }
        /* Abgeschlossener Knoten */
        .node.completed { background-color: #58CC02; color: white; opacity: 0.5; }

        /* Der Tooltip "Hierhin springen?" */
        .tooltip {
            position: absolute; top: -48px; background-color: #131F24;
            color: #58CC02; padding: 8px 15px; border-radius: 12px;
            font-weight: 900; font-size: 13px; border: 2px solid #3C4B53;
            z-index: 10; white-space: nowrap; animation: bounce 1s infinite;
        }
        .tooltip::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #3C4B53 transparent transparent transparent;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* Die grauen Charaktere (Eule, Bär etc.) im Hintergrund */
        .bg-character { position: absolute; font-size: 80px; opacity: 0.05; z-index: 1; pointer-events: none; }

        /* Untere Navigation (Exakt wie auf deinen Fotos) */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; background-color: #131F24;
            border-top: 2px solid #202F36; display: flex; justify-content: space-around;
            padding: 10px 0 20px 0; z-index: 100;
        }
        .nav-item {
            color: #52656D; font-size: 26px; padding: 8px 16px; border-radius: 12px;
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center;
        }
        .nav-item.active { color: #1CB0F6; border: 2px solid #1CB0F6; }
        
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="stat">🇪🇸 1</div>
            <div class="stat streak">🔥 4</div>
            <div class="stat gems">💎 717</div>
            <div class="stat hearts">❤️ 17</div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            
            <!-- Unit 1 Header -->
            <div class="unit-header bg-red">
                <div>
                    <h2>Stufe 1, Abschnitt 9</h2>
                    <p>Beschreibe Wetter mit "hace"</p>
                </div>
                <div style="font-size: 24px; opacity:0.8;">📖</div>
            </div>

            <!-- Der Pfad -->
            <div class="path-container">
                
                <!-- Hintergrund Deko (wie auf deinen Fotos) -->
                <div class="bg-character" style="top: 10%; left: 10%;">🦉</div>
                <div class="bg-character" style="top: 40%; right: 10%;">🐻</div>
                <div class="bg-character" style="top: 70%; left: 15%; font-size: 60px;">📦</div>

                <!-- 1. Knoten (Abgeschlossen) -->
                <div class="node-wrapper">
                    <button class="node completed">⭐</button>
                </div>

                <!-- 2. Knoten (Abgeschlossen) -->
                <div class="node-wrapper">
                    <button class="node completed">⭐</button>
                </div>

                <!-- 3. Knoten (Aktiv - Hierhin springen) -->
                <div class="node-wrapper">
                    <div class="tooltip">HIERHIN SPRINGEN?</div>
                    <button class="node active">▶️</button>
                </div>

                <!-- 4. Knoten (Gesperrt) -->
                <div class="node-wrapper">
                    <button class="node locked">🎥</button>
                </div>

                <!-- 5. Knoten (Gesperrt) -->
                <div class="node-wrapper">
                    <button class="node locked">📖</button>
                </div>

                <!-- 6. Knoten (Gesperrt) -->
                <div class="node-wrapper">
                    <button class="node locked">🎧</button>
                </div>

                <!-- 7. Knoten (Gesperrt) -->
                <div class="node-wrapper">
                    <button class="node locked">⭐</button>
                </div>
                
                <!-- 8. Knoten (Gesperrt) -->
                <div class="node-wrapper">
                    <button class="node locked">📦</button>
                </div>

            </div>

            <!-- Unterer Abschnitt "Stufe 2" -->
            <div style="text-align: center; margin-top: 50px; opacity: 0.2;">
                <div style="background: #2A353B; padding: 10px 20px; border-radius: 10px; display: inline-block; margin-bottom: 10px; font-weight: 900;">ANSCHLIESSEND</div>
                <h2 style="font-size: 22px; font-weight: 900;">🔒 Stufe 2</h2>
                <p style="font-size: 14px; margin-top: 5px;">Lerne Wörter, Ausdrücke und Grammatik</p>
            </div>

        </div>

        <!-- Untere Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">🏠</div>
            <div class="nav-item">🏋️</div>
            <div class="nav-item">🛡️</div>
            <div class="nav-item">🎁</div>
            <div class="nav-item">👤</div>
        </div>

    </div>

</body>
</html>
